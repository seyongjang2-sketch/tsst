<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 우주 탐험대 (Three.js)</title>
    <style>
        body {
            margin: 0; padding: 0; overflow: hidden; background-color: #000;
            font-family: 'Malgun Gothic', sans-serif;
        }
        
        /* 정보 팝업창 UI (기존과 동일) */
        #info-modal {
            display: none; position: absolute;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 80%; max-width: 500px;
            background: rgba(15, 20, 40, 0.95);
            border: 3px solid #f9d71c; border-radius: 20px;
            padding: 25px; text-align: center; color: white;
            box-shadow: 0 0 30px rgba(249, 215, 28, 0.4);
            z-index: 100;
        }
        #info-modal h2 { margin: 0 0 15px 0; color: #f9d71c; font-size: 28px; }
        #info-modal iframe { width: 100%; height: 250px; border: none; border-radius: 10px; }
        #info-modal p { font-size: 18px; line-height: 1.6; word-break: keep-all; }
        .close-btn {
            margin-top: 15px; padding: 12px 30px; font-size: 18px; font-weight: bold;
            background-color: #f9d71c; color: #000;
            border: none; border-radius: 30px; cursor: pointer;
            transition: 0.2s;
        }
        .close-btn:hover { background-color: #fff; }
        
        #guide {
            position: absolute; top: 20px; left: 20px; color: rgba(255,255,255,0.8);
            pointer-events: none; font-size: 15px; text-shadow: 1px 1px 2px black;
            z-index: 10;
        }
        /* 로딩 텍스트 */
        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; font-size: 20px;
        }
    </style>
    
    <!-- Three.js ES Modules 로드를 위한 Import Map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

<div id="loading">우주를 불러오는 중...</div>
<div id="guide">
    💡 좌클릭 드래그: 우주 회전<br>
    💡 마우스 휠: 확대/축소<br>
    💡 우클릭 드래그: 우주 이동<br>
    💡 큰 별을 클릭해 보세요!
</div>

<div id="info-modal">
    <h2 id="star-name">별 이름</h2>
    <iframe id="star-video" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    <p id="star-desc">별 설명</p>
    <button class="close-btn" id="close-btn">우주로 돌아가기</button>
</div>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    document.getElementById('loading').style.display = 'none';

    // 1. 씬, 카메라, 렌더러 설정
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000000, 0.0005); // 우주 외곽이 자연스럽게 어두워지는 안개 효과

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
    camera.position.set(0, 50, 400); // 초기 카메라 위치

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // 2. OrbitControls (사용자 입력 제어 - 여기서 1줄로 처리됨)
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true; // 부드러운 감속 효과
    controls.dampingFactor = 0.05;
    controls.maxDistance = 1000; // 최대 줌아웃 제한

    // 3. 배경 별 생성 (Particles 시스템 - 최적화)
    const starsGeometry = new THREE.BufferGeometry();
    const starsCount = 3000; // 3천개의 별
    const posArray = new Float32Array(starsCount * 3);

    for(let i = 0; i < starsCount * 3; i++) {
        // -1000 ~ 1000 공간 안에 무작위 배치
        posArray[i] = (Math.random() - 0.5) * 2000; 
    }
    starsGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));

    // 배경 별의 재질
    const starsMaterial = new THREE.PointsMaterial({
        size: 1.5,
        color: 0xffffff,
        transparent: true,
        opacity: 0.8
    });
    const starParticles = new THREE.Points(starsGeometry, starsMaterial);
    scene.add(starParticles);

    // 4. 클릭 가능한 특별한 학습용 별 생성
    const specialStars = []; // Raycaster에서 검사할 배열

    const starDataList = [
        { x: -100, y: 30, z: -50, color: 0xFFD700, name: '북극성 (Polaris)', desc: '안녕! 나는 북극성이야. 항상 북쪽을 가리키고 있어서 길 잃은 배들의 나침반이 되어준단다.', videoUrl: 'https://www.youtube.com/embed/1v0Wv1M5U4M?autoplay=1&mute=1' },
        { x: 150, y: -40, z: 20, color: 0x00FFFF, name: '시리우스 (Sirius)', desc: '밤하늘에서 가장 눈부시게 빛나는 별 시리우스야! 아주 뜨거워서 파란 빛이 나지.', videoUrl: 'https://www.youtube.com/embed/9GsnA-0BIt8?autoplay=1&mute=1' },
        { x: 0, y: 120, z: -150, color: 0xFFA500, name: '베텔게우스 (Betelgeuse)', desc: '오리온자리에 있는 거대하고 붉은 할아버지 별이란다. 태양보다 훨씬 커!', videoUrl: 'https://www.youtube.com/embed/v9qXyNf9Wb8?autoplay=1&mute=1' }
    ];

    starDataList.forEach(data => {
        // 3D 구체 생성
        const geometry = new THREE.SphereGeometry(15, 32, 32);
        const material = new THREE.MeshBasicMaterial({ color: data.color });
        const sphere = new THREE.Mesh(geometry, material);
        
        sphere.position.set(data.x, data.y, data.z);
        
        // 중요: Mesh 안에 별의 정보 데이터 보관
        sphere.userData = { 
            name: data.name, 
            desc: data.desc, 
            videoUrl: data.videoUrl 
        };
        
        scene.add(sphere);
        specialStars.push(sphere); // 충돌 검사용 배열에 추가
    });

    // 5. 클릭(Raycaster) 충돌 감지
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener('click', (event) => {
        // 브라우저 화면 좌표를 WebGL의 정규화된 기기 좌표(NDC: -1 ~ +1)로 변환
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

        // 카메라 위치에서 마우스 클릭 방향으로 광선을 발사
        raycaster.setFromCamera(mouse, camera);

        // 발사된 광선과 특별한 별들이 부딪혔는지 검사
        const intersects = raycaster.intersectObjects(specialStars);

        if (intersects.length > 0) {
            // 부딪힌 첫 번째 객체(가장 가까운 별)의 데이터 추출
            const targetStarData = intersects[0].object.userData;
            openModal(targetStarData);
        }
    });

    // 6. 창 크기 조절 대응
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 7. 애니메이션 렌더링 루프
    const clock = new THREE.Clock();
    function animate() {
        requestAnimationFrame(animate);
        
        const elapsedTime = clock.getElapsedTime();
        
        // 은하수(배경 별)가 천천히 자전하는 효과
        starParticles.rotation.y = elapsedTime * 0.02;

        controls.update(); // Damping을 위해 매 프레임 업데이트 필요
        renderer.render(scene, camera);
    }
    animate();

    // === HTML 모달 UI 제어 ===
    const modal = document.getElementById('info-modal');
    const vName = document.getElementById('star-name');
    const vVideo = document.getElementById('star-video');
    const vDesc = document.getElementById('star-desc');
    const closeBtn = document.getElementById('close-btn');

    function openModal(starData) {
        vName.innerText = starData.name;
        vDesc.innerText = starData.desc;
        vVideo.src = starData.videoUrl;
        modal.style.display = 'block';
    }

    closeBtn.addEventListener('click', () => {
        modal.style.display = 'none';
        vVideo.src = ''; // 영상 중지
    });
</script>

</body>
</html>
