<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 3D 우주 탐험대 (GLTF 넥스트젠 버전) 🚀</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #000; font-family: 'Malgun Gothic', sans-serif; }
        
        /* 3D 모달 정보창 스타일링 */
        #info-modal { 
            display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            width: 85%; max-width: 650px; background: rgba(8, 12, 28, 0.96); 
            border: 4px solid #00ffff; border-radius: 30px; padding: 25px; text-align: center; color: white; 
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.5); z-index: 100; animation: scaleUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        @keyframes scaleUp {
            from { transform: translate(-50%, -50%) scale(0.8); opacity: 0; }
            to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        #info-modal h2 { margin: 0 0 15px 0; color: #00ffff; font-size: 32px; text-shadow: 0 0 10px rgba(0, 255, 255, 0.5); }
        
        /* [핵심 변형] 2D 캔버스를 제거하고 제2의 3D WebGL 캔버스 컨테이너 배치 */
        #modal-3d-container { width: 100%; height: 300px; border-radius: 20px; border: 2px solid #335588; background-color: #030308; margin-bottom: 15px; overflow: hidden; position: relative; }
        
        #star-desc { font-size: 19px; line-height: 1.6; word-break: keep-all; margin: 15px 0 25px 0; color: #ddeeff; }
        
        .close-btn { 
            padding: 12px 40px; font-size: 19px; font-weight: bold; background: linear-gradient(135deg, #00ffff, #0088cc); 
            color: #fff; border: none; border-radius: 40px; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(0, 255, 255, 0.4);
        }
        .close-btn:hover { transform: scale(1.05); box-shadow: 0 6px 25px rgba(0, 255, 255, 0.7); }
        #guide { position: absolute; top: 15px; left: 15px; color: rgba(255,255,255,0.8); pointer-events: none; font-size: 15px; text-shadow: 1px 1px 2px black; z-index: 10; font-weight: bold; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #00ffff; font-size: 22px; font-weight: bold; }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

<div id="loading">우주 망원경 가동 중...</div>
<div id="guide">🔭 드래그: 은하계 궤도 선회 | 마우스 휠: 줌인/아웃<br>⭐ 탐사할 천체를 클릭하면 독립된 3D 분석창이 열립니다.</div>

<div id="info-modal">
    <h2 id="star-name">천체 분석 고도계</h2>
    <div id="modal-3d-container"></div>
    <p id="star-desc">천체 데이터 로딩 중...</p>
    <button class="close-btn" id="close-btn">궤도로 복귀 🚀</button>
</div>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'; // GLTF 로더 엔진 주입

    document.getElementById('loading').style.display = 'none';

    // ==========================================
    // 1. 메인 우주 공간 (Scene 1) 설정
    // ==========================================
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 3000);
    camera.position.set(0, 100, 600);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // 배경 입자 은하수
    const starsGeometry = new THREE.BufferGeometry();
    const posArray = new Float32Array(5000 * 3);
    for(let i = 0; i < 5000 * 3; i++) { posArray[i] = (Math.random() - 0.5) * 2500; }
    starsGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    const starParticles = new THREE.Points(starsGeometry, new THREE.PointsMaterial({ size: 1.5, color: 0xffffff }));
    scene.add(starParticles);

    // 천체 메타데이터 정의
    const starDataList = [
        { x: 0, y: 0, z: 0, radius: 25, color: 0xFF8800, name: '태양 (The Sun)', desc: '태양계 중심에 위치한 거대한 가스 항성입니다. 초당 400만 톤의 질량을 에너지로 변환하며 빛나고 있습니다.', modelPath: './models/sun.glb' },
        { x: -180, y: 60, z: -120, radius: 15, color: 0x00FFFF, name: '시리우스 (Sirius)', desc: '밤하늘에서 가장 겉보기 등급이 높은 광도의 항성입니다. 표면 온도가 9,940K에 육박하는 A형 주계열성입니다.', modelPath: './models/sirius.glb' },
        { x: 200, y: -80, z: 150, radius: 35, color: 0xFF3300, name: '베텔게우스 (Betelgeuse)', desc: '오리온자리에 위치한 적색 초거성입니다. 반경이 태양의 약 700배에 달하며, 수명이 임박하여 초신성 폭발 단계를 앞두고 있습니다.', modelPath: './models/betelgeuse.glb' }
    ];

    const specialStars = [];
    starDataList.forEach(data => {
        const geometry = new THREE.SphereGeometry(data.radius, 32, 32);
        const material = new THREE.MeshBasicMaterial({ color: data.color });
        const sphere = new THREE.Mesh(geometry, material);
        sphere.position.set(data.x, data.y, data.z);
        sphere.userData = data;
        scene.add(sphere);
        specialStars.push(sphere);
    });

    // ==========================================
    // 2. 모달창 내부 독립형 3D 뷰어 (Scene 2) 설정
    // ==========================================
    const modalContainer = document.getElementById('modal-3d-container');
    const modalScene = new THREE.Scene();
    
    const modalCamera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000); // 비율은 초기화 시 재조정
    modalCamera.position.set(0, 0, 100);

    const modalRenderer = new THREE.WebGLRenderer({ antialias: true });
    modalRenderer.setSize(550, 300); // 임시 사이즈 지정
    modalRenderer.setPixelRatio(window.devicePixelRatio);
    modalContainer.appendChild(modalRenderer.domElement);

    // 모달 전용 제어기 및 조명 (물리적 입체감을 위해 조명 필수 필수)
    const modalControls = new OrbitControls(modalCamera, modalRenderer.domElement);
    modalControls.enableDamping = true;
    modalControls.autoRotate = true; // 아이들이 볼 때 자동으로 회전하도록 설정
    modalControls.autoRotateSpeed = 2.0;

    const subAmbientLight = new THREE.AmbientLight(0xffffff, 0.6);
    modalScene.add(subAmbientLight);
    const subDirectionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
    subDirectionalLight.position.set(50, 50, 50);
    modalScene.add(subDirectionalLight);

    let currentModel = null; // 메모리 관리를 위한 현재 로드된 모델 포인터
    const gltfLoader = new GLTFLoader();

    // 메인 루프 (Scene 1과 Scene 2를 동시 혹은 조건부 렌더링)
    function animate() {
        requestAnimationFrame(animate);
        
        // 메인 우주 제어
        starParticles.rotation.y += 0.0003;
        controls.update();
        renderer.render(scene, camera);

        // 모달창이 열려있을 때만 독립 3D 씬을 연산하여 성능 자원 방어
        if (document.getElementById('info-modal').style.display === 'block') {
            modalControls.update();
            modalRenderer.render(modalScene, modalCamera);
        }
    }
    animate();

    // ==========================================
    // 3. 인터랙션 및 GLTF 비동기 로딩 로직
    // ==========================================
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener('click', (event) => {
        // 클릭 영역이 UI 도큐먼트 내부면 전파 차단하여 오작동 방지
        if(event.target.tagName === 'BUTTON' || event.target.closest('#info-modal')) return;

        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        
        const intersects = raycaster.intersectObjects(specialStars);
        if (intersects.length > 0) {
            openGLTFModal(intersects[0].object.userData);
        }
    });

    function openGLTFModal(starData) {
        document.getElementById('star-name').innerText = starData.name;
        document.getElementById('star-desc').innerText = starData.desc;

        // 컨테이너 가로세로 비율 최적화 매핑
        const rect = modalContainer.getBoundingClientRect();
        modalCamera.aspect = rect.width / rect.height;
        modalCamera.updateProjectionMatrix();
        modalRenderer.setSize(rect.width, rect.height);

        // 이전 모델이 존재하면 씬에서 명시적으로 제거하여 가비지 컬렉션(GC) 유도
        if (currentModel) {
            modalScene.remove(currentModel);
        }

        // [핵심] GLTF 비동기 로드 및 강력한 폴백(Fallback) 안전장치
        gltfLoader.load(
            starData.modelPath,
            (gltf) => {
                // 로딩 성공 시 3D 자산 주입
                currentModel = gltf.scene;
                
                // 모델 스케일 및 위치 중앙 정렬 보정
                const box = new THREE.Box3().setFromObject(currentModel);
                const size = box.getSize(new THREE.Vector3()).length();
                const center = box.getCenter(new THREE.Vector3());
                
                currentModel.position.x += (currentModel.position.x - center.x);
                currentModel.position.y += (currentModel.position.y - center.y);
                currentModel.position.z += (currentModel.position.z - center.z);
                
                // 화면 크기에 맞게 자동 스케일링 안정화
                const scaleFactor = 40 / size;
                currentModel.scale.set(scaleFactor, scaleFactor, scaleFactor);

                modalScene.add(currentModel);
            },
            (xhr) => {
                // 프로그레스 바 구현 가능 영역
            },
            (error) => {
                // [폴백 시스템] 만약 로컬에 고유 모델(.glb)이 없거나 로딩 실패 시 
                // 아이들에게 빈 화면을 보여주지 않고 즉시 아름다운 대체 고퀄리티 PBR 구체를 생성
                console.warn(`${starData.name} 모델 로드 실패. 대체 엔진 가동.`);
                
                const fallbackGeo = new THREE.SphereGeometry(20, 64, 64);
                const fallbackMat = new THREE.MeshStandardMaterial({
                    color: starData.color,
                    roughness: 0.2,
                    metalness: 0.8,
                    emissive: starData.color,
                    emissiveIntensity: 0.3
                });
                
                currentModel = new THREE.Mesh(fallbackGeo, fallbackMat);
                modalScene.add(currentModel);
            }
        );

        document.getElementById('info-modal').style.display = 'block';
    }

    document.getElementById('close-btn').addEventListener('click', () => {
        document.getElementById('info-modal').style.display = 'none';
        if (currentModel) {
            modalScene.remove(currentModel);
            currentModel = null;
        }
    });

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>

</body>
</html>
