<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 우주 탐험대 (무한 확장 캔버스 버전)</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #000; font-family: 'Malgun Gothic', sans-serif; }
        #info-modal { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 80%; max-width: 600px; background: rgba(10, 15, 30, 0.98); border: 4px solid #f9d71c; border-radius: 25px; padding: 30px; text-align: center; color: white; box-shadow: 0 0 50px rgba(249, 215, 28, 0.5); z-index: 100; border-style: outset; }
        #info-modal h2 { margin: 0 0 20px 0; color: #f9d71c; font-size: 32px; text-shadow: 1px 1px 5px rgba(255,255,255,0.3); }
        
        /* 이미지 태그 대신 HTML5 Canvas 요소를 스타일링 */
        #star-canvas { width: 100%; height: 280px; border-radius: 15px; border: 2px solid #555; background-color: #020205; margin-bottom: 15px; display: block; box-shadow: inset 0 0 20px #000; }
        
        #info-modal p { font-size: 20px; line-height: 1.6; word-break: keep-all; margin: 15px 0 25px 0; color: #ffffff; }
        .close-btn { padding: 15px 40px; font-size: 20px; font-weight: bold; background-color: #f9d71c; color: #000; border: none; border-radius: 35px; cursor: pointer; transition: 0.2s; border-style: inset; }
        .close-btn:hover { background-color: #fff; transform: scale(1.05); }
        #guide { position: absolute; top: 20px; left: 20px; color: rgba(255,255,255,0.8); pointer-events: none; font-size: 16px; text-shadow: 1px 1px 2px black; z-index: 10; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 22px; }
    </style>
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
    </script>
</head>
<body>

<div id="loading">우주 탐험 지도를 불러오는 중...</div>
<div id="guide">💡 좌클릭 드래그: 우주 여행 | 마우스 휠: 줌인 | 큰 별을 클릭해 보세요!</div>

<div id="info-modal">
    <h2 id="star-name">별 이름</h2>
    <canvas id="star-canvas" width="600" height="280"></canvas>
    <p id="star-desc">별 설명</p>
    <button class="close-btn" id="close-btn">우주 여행 계속하기</button>
</div>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    document.getElementById('loading').style.display = 'none';

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
    camera.position.set(0, 50, 400);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // 배경 은하수 생성
    const starsGeometry = new THREE.BufferGeometry();
    const posArray = new Float32Array(4000 * 3);
    for(let i = 0; i < 4000 * 3; i++) { posArray[i] = (Math.random() - 0.5) * 2000; }
    starsGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    const starParticles = new THREE.Points(starsGeometry, new THREE.PointsMaterial({ size: 1.5, color: 0xffffff, transparent: true, opacity: 0.8 }));
    scene.add(starParticles);

    // [데이터 간소화] 이미지 주소(mediaUrl)를 완전히 삭제. 오직 헥스(Hex) 색상 코드만으로 구별.
    const starDataList = [
        { 
            x: -100, y: 30, z: -50, 
            color: 0xFFF4E8, // 북극성: 은은한 황백색
            name: '북극성 (Polaris)', 
            desc: '안녕! 나는 밤하늘에서 항상 북쪽을 가리키는 별이야. 스스로 빛을 내는 거대한 황백색 항성이란다.'
        },
        { 
            x: 150, y: -40, z: 20, 
            color: 0x88CCFF, // 시리우스: 뜨거운 푸른색
            name: '시리우스 (Sirius)', 
            desc: '난 밤하늘에서 가장 눈부시게 빛나는 별이야. 태양보다 훨씬 뜨거워서 아주 신비로운 푸른 빛을 뿜어내지!'
        },
        { 
            x: 0, y: 120, z: -150, 
            color: 0xFF4422, // 베텔게우스: 거대한 붉은색
            name: '베텔게우스 (Betelgeuse)', 
            desc: '나는 오리온자리의 어깨에 있는 거대하고 붉은 별이야. 나이가 많고 크기가 엄청나게 커서 붉게 빛난단다.'
        }
    ];

    const specialStars = [];

    starDataList.forEach(data => {
        const geometry = new THREE.SphereGeometry(18, 32, 32); 
        const material = new THREE.MeshBasicMaterial({ color: data.color });
        const sphere = new THREE.Mesh(geometry, material);
        sphere.position.set(data.x, data.y, data.z);
        
        // 데이터 저장
        sphere.userData = { name: data.name, desc: data.desc, color: data.color };
        scene.add(sphere);
        specialStars.push(sphere);
    });

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener('click', (event) => {
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(specialStars);
        if (intersects.length > 0) {
            openModal(intersects[0].object.userData);
        }
    });

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight; 
        camera.updateProjectionMatrix(); 
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
        requestAnimationFrame(animate);
        starParticles.rotation.y += 0.001; // 은하수 천천히 회전
        controls.update();
        renderer.render(scene, camera);
    }
    animate();

    // === HTML 모달 및 캔버스 드로잉 제어 ===
    const modal = document.getElementById('info-modal');
    const vName = document.getElementById('star-name');
    const vDesc = document.getElementById('star-desc');
    const closeBtn = document.getElementById('close-btn');
    const canvas = document.getElementById('star-canvas');
    const ctx = canvas.getContext('2d');

    // 16진수 색상(0xFF0000)을 RGB(255, 0, 0) 문자열로 변환하는 유틸리티 함수
    function hexToRgb(hex) {
        const r = (hex >> 16) & 255;
        const g = (hex >> 8) & 255;
        const b = hex & 255;
        return `${r}, ${g}, ${b}`;
    }

    // 캔버스에 실시간으로 우주와 별을 그리는 함수
    function drawStarOnCanvas(colorHex) {
        const width = canvas.width;
        const height = canvas.height;
        const centerX = width / 2;
        const centerY = height / 2;

        // 1. 캔버스 초기화 및 심우주(어두운 배경) 그리기
        ctx.fillStyle = '#030308';
        ctx.fillRect(0, 0, width, height);

        // 2. 배경에 무작위 작은 별들 뿌리기 (입체감 부여)
        for(let i = 0; i < 80; i++) {
            ctx.fillStyle = `rgba(255, 255, 255, ${Math.random()})`;
            ctx.beginPath();
            ctx.arc(Math.random() * width, Math.random() * height, Math.random() * 1.5, 0, Math.PI * 2);
            ctx.fill();
        }

        // 3. 중심 별의 빛 번짐(Glow) 효과 생성
        const rgbString = hexToRgb(colorHex);
        const maxRadius = 120; // 빛이 퍼지는 최대 반경
        
        // 원형 그라데이션 생성 (중심은 가장 밝고, 바깥으로 갈수록 투명해짐)
        const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, maxRadius);
        gradient.addColorStop(0, `rgba(255, 255, 255, 1)`);           // 중심핵: 순백색
        gradient.addColorStop(0.15, `rgba(${rgbString}, 0.9)`);       // 내부 코어: 별의 고유 색상
        gradient.addColorStop(0.5, `rgba(${rgbString}, 0.3)`);        // 중간 후광
        gradient.addColorStop(1, `rgba(${rgbString}, 0)`);            // 우주 배경과 융합

        // 4. 별 그리기
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(centerX, centerY, maxRadius, 0, Math.PI * 2);
        ctx.fill();
    }

    function openModal(starData) {
        vName.innerText = starData.name;
        vDesc.innerText = starData.desc;
        
        // 사진을 로드하는 대신, 캔버스에 즉시 별을 그려냅니다.
        drawStarOnCanvas(starData.color);
        
        modal.style.display = 'block';
    }

    closeBtn.addEventListener('click', () => {
        modal.style.display = 'none';
        // 캔버스 초기화 (메모리 확보)
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    });
</script>

</body>
</html>
