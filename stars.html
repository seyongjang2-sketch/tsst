<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>우리 아기 밤하늘 - FamilySpace</title>
    <style>
      body { margin: 0; overflow: hidden; background: #00040a; }
      canvas { display: block; touch-action: none; }
      .sky-ui {
        position: absolute; top: 100px; left: 50%; transform: translateX(-50%);
        text-align: center; color: white; pointer-events: none; width: 100%; font-family: sans-serif;
      }
      .sky-ui h1 { font-size: 2.2rem; text-shadow: 0 0 20px rgba(255,255,255,0.5); margin: 0; }
      .sky-ui p { font-size: 1rem; opacity: 0.7; margin-top: 10px; }
      .controls-hint {
        position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
        color: rgba(255,255,255,0.4); font-size: 0.85rem; text-align: center; pointer-events: none;
      }
      .back-btn {
        position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.1);
        color: white; border: 1px solid rgba(255,255,255,0.3); padding: 8px 18px;
        border-radius: 50px; text-decoration: none; font-size: 0.9rem; z-index: 100;
      }
    </style>
  </head>
  <body>
    <canvas id="starCanvas"></canvas>
    <div class="sky-ui">
      <h1>환상적인 우리 가족 은하수 🌌</h1>
      <p>우주를 자유롭게 탐험해보세요</p>
    </div>
    <div class="controls-hint">
      마우스 휠이나 두 손가락으로 확대/축소를 해보세요.<br>
      화면을 드래그하면 은하수 속을 여행할 수 있습니다.
    </div>
    <a href="index.html" class="back-btn">돌아가기</a>

    <script>
      const canvas = document.getElementById('starCanvas');
      const ctx = canvas.getContext('2d');
      let stars = [];
      let nebula = [];
      let scale = 1;
      let offsetX = 0;
      let offsetY = 0;
      let isDragging = false;
      let lastMouse = { x: 0, y: 0 };

      function init() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        // Create Nebula (Milky Way)
        nebula = [];
        for(let i=0; i<15; i++) {
          nebula.push({
            x: Math.random() * 3000 - 1500,
            y: Math.random() * 2000 - 1000,
            radius: 300 + Math.random() * 400,
            color: 'hsla(' + (200 + Math.random() * 60) + ', 70%, 50%, 0.05)'
          });
        }

        // Create Stars
        stars = [];
        for (let i = 0; i < 1500; i++) {
          stars.push({
            x: Math.random() * 4000 - 2000,
            y: Math.random() * 4000 - 2000,
            size: Math.random() * 1.5,
            opacity: Math.random(),
            twinkle: 0.01 + Math.random() * 0.02
          });
        }
      }

      function draw() {
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.fillStyle = '#00040a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.translate(canvas.width/2 + offsetX, canvas.height/2 + offsetY);
        ctx.scale(scale, scale);

        // Draw Nebula
        nebula.forEach(n => {
          let grd = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.radius);
          grd.addColorStop(0, n.color);
          grd.addColorStop(1, 'transparent');
          ctx.fillStyle = grd;
          ctx.beginPath();
          ctx.arc(n.x, n.y, n.radius, 0, Math.PI * 2);
          ctx.fill();
        });

        // Draw Stars
        stars.forEach(star => {
          ctx.fillStyle = 'rgba(255, 255, 255, ' + star.opacity + ')';
          ctx.beginPath();
          ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
          ctx.fill();
          
          star.opacity += star.twinkle;
          if (star.opacity > 1 || star.opacity < 0.2) star.twinkle *= -1;
        });

        requestAnimationFrame(draw);
      }

      // Interaction
      window.addEventListener('wheel', e => {
        const zoomSpeed = 0.001;
        scale -= e.deltaY * zoomSpeed;
        scale = Math.min(Math.max(0.5, scale), 5);
      });

      window.addEventListener('mousedown', e => { isDragging = true; lastMouse = { x: e.x, y: e.y }; });
      window.addEventListener('mousemove', e => {
        if (isDragging) {
          offsetX += e.x - lastMouse.x;
          offsetY += e.y - lastMouse.y;
          lastMouse = { x: e.x, y: e.y };
        }
      });
      window.addEventListener('mouseup', () => isDragging = false);

      // Mobile Touch
      let lastTouchDist = 0;
      window.addEventListener('touchstart', e => {
        if (e.touches.length === 1) {
          isDragging = true;
          lastMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        } else if (e.touches.length === 2) {
          lastTouchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        }
      });
      window.addEventListener('touchmove', e => {
        if (e.touches.length === 1 && isDragging) {
          offsetX += e.touches[0].clientX - lastMouse.x;
          offsetY += e.touches[0].clientY - lastMouse.y;
          lastMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        } else if (e.touches.length === 2) {
          let dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
          scale *= dist / lastTouchDist;
          scale = Math.min(Math.max(0.5, scale), 5);
          lastTouchDist = dist;
        }
      });
      window.addEventListener('touchend', () => isDragging = false);

      window.addEventListener('resize', init);
      init();
      draw();
    </script>
  </body>
</html>
