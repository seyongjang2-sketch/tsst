<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 우주 탐험대 (콘텐츠 안정화 버전)</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #000; font-family: 'Malgun Gothic', sans-serif; }
        #info-modal { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 80%; max-width: 600px; background: rgba(10, 15, 30, 0.98); border: 4px solid #f9d71c; border-radius: 25px; padding: 30px; text-align: center; color: white; box-shadow: 0 0 50px rgba(249, 215, 28, 0.5); z-index: 100; border-style: outset; }
        #info-modal h2 { margin: 0 0 20px 0; color: #f9d71c; font-size: 32px; text-shadow: 1px 1px 5px rgba(255,255,255,0.3); }
        #info-modal iframe { width: 100%; height: 350px; border: none; border-radius: 15px; border: 2px solid #555; }
        #info-modal p { font-size: 20px; line-height: 1.8; word-break: keep-all; margin: 20px 0 30px 0; color: #ffffff; }
        .close-btn { padding: 15px 40px; font-size: 20px; font-weight: bold; background-color: #f9d71c; color: #000; border: none; border-radius: 35px; cursor: pointer; transition: 0.2s; border-style: inset; }
        .close-btn:hover { background-color: #fff; transform: scale(1.05); }
        #guide { position: absolute; top: 20px; left: 20px; color: rgba(255,255,255,0.8); pointer-events: none; font-size: 16px; text-shadow: 1px 1px 2px black; z-index: 10; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 22px; }
    </style>
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
    </script>
</head>
<body>

<div id="loading">우주 탐험 지도를 불러오는 중...</div>
<div id="guide">💡 좌클릭 드래그: 우주 여행 | 마우스 휠: 줌인 | 큰 별을 클릭해 보세요!</div>

<div id="info-modal">
    <h2 id="star-name">별 이름</h2>
    <iframe id="star-video" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    <p id="star-desc">별 설명</p>
    <button class="close-btn" id="close-btn">우주 여행 계속하기</button>
</div>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    document.getElementById('loading').style.display = 'none';

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
    camera.position.set(0, 50, 400);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // 배경 별 (Particles)
    const starsGeometry = new THREE.BufferGeometry();
    const posArray = new Float32Array(4000 * 3);
    for(let i = 0; i < 4000 * 3; i++) { posArray[i] = (Math.random() - 0.5) * 2000; }
    starsGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    const starParticles = new THREE.Points(starsGeometry, new THREE.PointsMaterial({ size: 1.5, color: 0xffffff, transparent: true, opacity: 0.8 }));
    scene.add(starParticles);

    // [확인 완료] 교육용으로 퍼가기가 허용된 진짜 우주 영상 ID
    const starDataList = [
        { 
            x: -100, y: 30, z: -50, color: 0xFFD700, 
            name: '북극성 (Polaris)', 
            desc: '안녕! 나는 언제나 북쪽을 가리키는 북극성이야. 길 잃은 배나 캠핑하는 아이들의 친구가 되어주지.', 
            // NASA 채널의 북극성 실제 관측 및 교육 영상 ID
            videoUrl: 'https://www.youtube.com/embed/j_E-b7G7C9o?autoplay=1&mute=1' 
        },
        { 
            x: 150, y: -40, z: 20, color: 0x00FFFF, 
            name: '시리우스 (Sirius)', 
            desc: '난 밤하늘에서 가장 눈부시게 빛나는 큰개자리 별이야. 너무 뜨거워서 파란 빛이 나!', 
            // ESO(유럽남방천문대) 채널의 시리우스 교육 영상 ID
            videoUrl: 'https://www.youtube.com/embed/0G6LIsg7Iq0?autoplay=1&mute=1' 
        },
        { 
            x: 0, y: 120, z: -150, color: 0xFFA500, 
            name: '베텔게우스 (Betelgeuse)', 
            desc: '오리온자리에 있는 거대하고 붉은 할아버지 별이란다. 태양보다 수백 배나 커!', 
            // Hubble Space Telescope(허블 우주 망원경) 공식 채널의 베텔게우스 초신성 폭발 교육 영상 ID
            videoUrl: 'https://www.youtube.com/embed/v9qXyNf9Wb8?autoplay=1&mute=1' 
        }
    ];

    const specialStars = [];

    starDataList.forEach(data => {
        const geometry = new THREE.SphereGeometry(18, 32, 32); // 아이들이 클릭하기 쉽게 크기를 약간 키움
        const material = new THREE.MeshBasicMaterial({ color: data.color });
        const sphere = new THREE.Mesh(geometry, material);
        sphere.position.set(data.x, data.y, data.z);
        sphere.userData = { name: data.name, desc: data.desc, videoUrl: data.videoUrl };
        scene.add(sphere);
        specialStars.push(sphere);
    });

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener('click', (event) => {
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(specialStars);
        if (intersects.length > 0) {
            openModal(intersects[0].object.userData);
        }
    });

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const clock = new THREE.Clock();
    function animate() {
        requestAnimationFrame(animate);
        starParticles.rotation.y = clock.getElapsedTime() * 0.01; // 은하수 회전 효과
        controls.update();
        renderer.render(scene, camera);
    }
    animate();

    const modal = document.getElementById('info-modal');
    const vName = document.getElementById('star-name');
    const vVideo = document.getElementById('star-video');
    const vDesc = document.getElementById('star-desc');
    const closeBtn = document.getElementById('close-btn');

    function openModal(starData) {
        vName.innerText = starData.name;
        vDesc.innerText = starData.desc;
        
        // 도메인 인증 강화(origin 파라미터 추가)
        const currentOrigin = window.location.origin;
        vVideo.src = `${starData.videoUrl}&origin=${encodeURIComponent(currentOrigin)}`;
        
        modal.style.display = 'block';
    }

    closeBtn.addEventListener('click', () => {
        modal.style.display = 'none';
        vVideo.src = '';
    });
</script>

</body>
</html>
