<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 우주 탐험대 (확장된 동화책 버전)</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #000; font-family: 'Malgun Gothic', sans-serif; }
        #info-modal { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; max-width: 650px; background: rgba(10, 15, 30, 0.95); border: 4px solid #f9d71c; border-radius: 25px; padding: 30px; text-align: center; color: white; box-shadow: 0 0 60px rgba(249, 215, 28, 0.4); z-index: 100; border-style: outset; }
        
        /* 제목에 부드러운 빛 효과 추가 */
        #info-modal h2 { margin: 0 0 20px 0; color: #f9d71c; font-size: 34px; text-shadow: 0 0 15px rgba(249, 215, 28, 0.8); }
        
        #star-canvas { width: 100%; height: 280px; border-radius: 15px; border: 2px solid #444; background-color: #020205; margin-bottom: 20px; display: block; box-shadow: inset 0 0 30px #000; }
        
        /* 아이들이 읽기 편하도록 폰트 크기 및 줄간격 최적화 */
        #star-desc { font-size: 22px; line-height: 1.7; word-break: keep-all; margin: 15px 0 30px 0; color: #eef; font-weight: bold; text-shadow: 1px 1px 2px #000; }
        
        .close-btn { padding: 15px 40px; font-size: 22px; font-weight: bold; background-color: #f9d71c; color: #000; border: none; border-radius: 35px; cursor: pointer; transition: 0.2s; border-style: inset; }
        .close-btn:hover { background-color: #fff; transform: scale(1.05); box-shadow: 0 0 20px #fff; }
        #guide { position: absolute; top: 20px; left: 20px; color: rgba(255,255,255,0.9); pointer-events: none; font-size: 18px; text-shadow: 1px 1px 3px black; z-index: 10; font-weight: bold; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 24px; font-weight: bold; }
    </style>
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
    </script>
</head>
<body>

<div id="loading">우주 지도를 펴는 중...</div>
<div id="guide">💡 마우스로 우주를 돌려보세요! | 휠: 줌인/줌아웃 | 반짝이는 큰 별들을 클릭해봐!</div>

<div id="info-modal">
    <h2 id="star-name">별 이름</h2>
    <canvas id="star-canvas" width="650" height="280"></canvas>
    <p id="star-desc">별 설명</p>
    <button class="close-btn" id="close-btn">우주 여행 계속하기 🚀</button>
</div>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    document.getElementById('loading').style.display = 'none';

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 3000);
    camera.position.set(0, 50, 500); // 별이 많아졌으므로 카메라를 약간 뒤로 뺌

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // 배경 은하수 생성 (별 개수 6000개로 증가)
    const starsGeometry = new THREE.BufferGeometry();
    const posArray = new Float32Array(6000 * 3);
    for(let i = 0; i < 6000 * 3; i++) { posArray[i] = (Math.random() - 0.5) * 2500; }
    starsGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    const starParticles = new THREE.Points(starsGeometry, new THREE.PointsMaterial({ size: 1.5, color: 0xffffff, transparent: true, opacity: 0.7 }));
    scene.add(starParticles);

    // [핵심] 별자리 데이터베이스 확장 및 크기(radius) 변수 추가
    const starDataList = [
        { 
            x: 0, y: 0, z: 0, 
            radius: 15, color: 0xFFDD44, // 태양: 중간 크기, 노란색
            name: '태양 (The Sun)', 
            desc: '안녕! 나는 지구에서 가장 가까운 별, 태양이야! 내가 매일 따뜻한 빛을 주지 않으면 지구는 꽁꽁 얼어붙고 말 거야. 내 품은 아주아주 뜨겁단다! ☀️'
        },
        { 
            x: -120, y: 80, z: -80, 
            radius: 12, color: 0xFFF4E8, // 북극성
            name: '북극성 (Polaris)', 
            desc: '우주에서 길을 잃었니? 밤하늘에서 나를 찾아봐! 나는 항상 북쪽을 가리키고 있어서, 옛날 뱃사람들의 멋진 나침반 요정이 되어주었어. 🧭'
        },
        { 
            x: 180, y: -50, z: 100, 
            radius: 18, color: 0x88CCFF, // 시리우스
            name: '시리우스 (Sirius)', 
            desc: '눈이 부시지? 나는 밤하늘에서 제일 밝게 빛나는 시리우스야! 파란 가스 불꽃처럼 온도가 엄청나게 높아서 이렇게 푸른 빛을 뿜어내고 있지! 💎'
        },
        { 
            x: -80, y: 150, z: -200, 
            radius: 35, color: 0xFF3311, // 베텔게우스: 매우 거대함, 붉은색
            name: '베텔게우스 (Betelgeuse)', 
            desc: '쿵쾅! 쿵쾅! 나는 수명이 다해가서 몸집이 엄청나게 부풀어 오른 할아버지 별이야. 태양보다 수백 배나 뚱뚱해서 붉은 빛이 나지. 언젠가 펑! 하고 터질지도 몰라! 🌋'
        },
        { 
            x: 250, y: 100, z: -50, 
            radius: 25, color: 0xAAFFFF, // 리겔: 크고 푸른 별
            name: '리겔 (Rigel)', 
            desc: '안녕! 나는 오리온자리의 발끝에서 빛나는 젊고 힘센 별, 리겔이야. 엄청나게 멀리 있지만, 빛을 뿜어내는 힘이 엄청 세서 너희 눈에도 잘 보인단다! 🌠'
        },
        { 
            x: -200, y: -100, z: 150, 
            radius: 28, color: 0xFF2200, // 안타레스: 붉고 거대함
            name: '안타레스 (Antares)', 
            desc: '내 이름은 "화성의 라이벌"이라는 뜻을 가졌어! 전갈자리의 한가운데서 마치 붉은 심장처럼 쿵쾅대며 빛나고 있지. 화성보다 더 붉고 무서운 불덩어리란다! ❤️‍🔥'
        }
    ];

    const specialStars = [];

    // 데이터를 바탕으로 3D 공간에 별 배치
    starDataList.forEach(data => {
        // 별의 크기(radius)를 데이터에서 가져와서 반영
        const geometry = new THREE.SphereGeometry(data.radius, 32, 32); 
        const material = new THREE.MeshBasicMaterial({ color: data.color });
        const sphere = new THREE.Mesh(geometry, material);
        sphere.position.set(data.x, data.y, data.z);
        
        sphere.userData = { name: data.name, desc: data.desc, color: data.color, radius: data.radius };
        scene.add(sphere);
        specialStars.push(sphere);
    });

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener('click', (event) => {
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(specialStars);
        if (intersects.length > 0) {
            openModal(intersects[0].object.userData);
        }
    });

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight; 
        camera.updateProjectionMatrix(); 
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
        requestAnimationFrame(animate);
        starParticles.rotation.y += 0.0005; // 부드러운 우주 회전
        controls.update();
        renderer.render(scene, camera);
    }
    animate();

    // === HTML 모달 및 캔버스 드로잉 ===
    const modal = document.getElementById('info-modal');
    const vName = document.getElementById('star-name');
    const vDesc = document.getElementById('star-desc');
    const closeBtn = document.getElementById('close-btn');
    const canvas = document.getElementById('star-canvas');
    const ctx = canvas.getContext('2d');

    function hexToRgb(hex) {
        const r = (hex >> 16) & 255;
        const g = (hex >> 8) & 255;
        const b = hex & 255;
        return `${r}, ${g}, ${b}`;
    }

    // 캔버스 드로잉 시 별의 크기(radius)도 반영하여 렌더링
    function drawStarOnCanvas(colorHex, starRadius) {
        const width = canvas.width;
        const height = canvas.height;
        const centerX = width / 2;
        const centerY = height / 2;

        ctx.fillStyle = '#030308';
        ctx.fillRect(0, 0, width, height);

        for(let i = 0; i < 100; i++) {
            ctx.fillStyle = `rgba(255, 255, 255, ${Math.random()})`;
            ctx.beginPath();
            ctx.arc(Math.random() * width, Math.random() * height, Math.random() * 1.5, 0, Math.PI * 2);
            ctx.fill();
        }

        const rgbString = hexToRgb(colorHex);
        // 별의 크기에 비례하여 빛 번짐 반경 설정 (최소 80, 최대 150)
        const maxRadius = Math.min(Math.max(starRadius * 4, 80), 150); 
        
        const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, maxRadius);
        gradient.addColorStop(0, `rgba(255, 255, 255, 1)`);
        gradient.addColorStop(0.15, `rgba(${rgbString}, 0.9)`);
        gradient.addColorStop(0.5, `rgba(${rgbString}, 0.3)`);
        gradient.addColorStop(1, `rgba(${rgbString}, 0)`);

        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(centerX, centerY, maxRadius, 0, Math.PI * 2);
        ctx.fill();
    }

    function openModal(starData) {
        vName.innerText = starData.name;
        vDesc.innerText = starData.desc;
        // 크기 데이터(radius)도 캔버스 함수로 전달
        drawStarOnCanvas(starData.color, starData.radius);
        modal.style.display = 'block';
    }

    closeBtn.addEventListener('click', () => {
        modal.style.display = 'none';
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    });
</script>

</body>
</html>
