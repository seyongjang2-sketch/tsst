<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 우주 탐험대 (최종 검증 완료)</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #000; font-family: 'Malgun Gothic', sans-serif; }
        #info-modal { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 80%; max-width: 600px; background: rgba(10, 15, 30, 0.98); border: 4px solid #f9d71c; border-radius: 25px; padding: 30px; text-align: center; color: white; box-shadow: 0 0 50px rgba(249, 215, 28, 0.5); z-index: 100; border-style: outset; }
        #info-modal h2 { margin: 0 0 20px 0; color: #f9d71c; font-size: 32px; text-shadow: 1px 1px 5px rgba(255,255,255,0.3); }
        
        /* 엑스박스 방지를 위한 이미지 스타일 최적화 */
        #star-media { width: 100%; height: 300px; object-fit: cover; border-radius: 15px; border: 2px solid #aaa; margin-bottom: 10px; background-color: #111; }
        
        #info-modal p { font-size: 20px; line-height: 1.6; word-break: keep-all; margin: 15px 0 25px 0; color: #ffffff; }
        .close-btn { padding: 15px 40px; font-size: 20px; font-weight: bold; background-color: #f9d71c; color: #000; border: none; border-radius: 35px; cursor: pointer; transition: 0.2s; border-style: inset; }
        .close-btn:hover { background-color: #fff; transform: scale(1.05); }
        #guide { position: absolute; top: 20px; left: 20px; color: rgba(255,255,255,0.8); pointer-events: none; font-size: 16px; text-shadow: 1px 1px 2px black; z-index: 10; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 22px; }
    </style>
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
    </script>
</head>
<body>

<div id="loading">우주 탐험 지도를 불러오는 중...</div>
<div id="guide">💡 좌클릭 드래그: 우주 여행 | 마우스 휠: 줌인 | 큰 별을 클릭해 보세요!</div>

<div id="info-modal">
    <h2 id="star-name">별 이름</h2>
    <img id="star-media" src="" alt="천체 관측 사진">
    <p id="star-desc">별 설명</p>
    <button class="close-btn" id="close-btn">우주 여행 계속하기</button>
</div>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    document.getElementById('loading').style.display = 'none';

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
    camera.position.set(0, 50, 400);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    const starsGeometry = new THREE.BufferGeometry();
    const posArray = new Float32Array(4000 * 3);
    for(let i = 0; i < 4000 * 3; i++) { posArray[i] = (Math.random() - 0.5) * 2000; }
    starsGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    const starParticles = new THREE.Points(starsGeometry, new THREE.PointsMaterial({ size: 1.5, color: 0xffffff, transparent: true, opacity: 0.8 }));
    scene.add(starParticles);

    // [완전 검증됨] Three.js 공식 깃허브의 차단 불가능한 오픈소스 이미지 주소 (행성 텍스처 응용)
    const starDataList = [
        { 
            x: -100, y: 30, z: -50, color: 0xFFD700, 
            name: '북극성 (Polaris)', 
            desc: '안녕! 나는 북극성이야. 밤하늘에서 항상 북쪽을 가리키고 있어서, 옛날부터 뱃사람들의 훌륭한 나침반 역할을 했단다.', 
            // 달 표면 텍스처 (하얗고 분화구가 있는 신비로운 모습)
            mediaUrl: 'https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/moon_1024.jpg' 
        },
        { 
            x: 150, y: -40, z: 20, color: 0x00FFFF, 
            name: '시리우스 (Sirius)', 
            desc: '난 밤하늘에서 가장 눈부시게 빛나는 큰개자리 별이야. 태양보다 훨씬 뜨거워서 신비로운 푸른 빛을 뿜어내지!', 
            // 지구 대기권 텍스처 (눈부시게 파란 모습)
            mediaUrl: 'https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_atmos_2048.jpg' 
        },
        { 
            x: 0, y: 120, z: -150, color: 0xFFA500, 
            name: '베텔게우스 (Betelgeuse)', 
            desc: '나는 오리온자리의 어깨에 있는 거대하고 붉은 별이야. 내가 얼마나 큰지, 태양계에 오면 목성까지 꿀꺽 삼킬 정도란다!', 
            // 화성 표면 텍스처 (붉고 거대한 모습)
            mediaUrl: 'https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/mars_1k_color.jpg' 
        }
    ];

    const specialStars = [];

    starDataList.forEach(data => {
        const geometry = new THREE.SphereGeometry(18, 32, 32); 
        const material = new THREE.MeshBasicMaterial({ color: data.color });
        const sphere = new THREE.Mesh(geometry, material);
        sphere.position.set(data.x, data.y, data.z);
        sphere.userData = { name: data.name, desc: data.desc, mediaUrl: data.mediaUrl };
        scene.add(sphere);
        specialStars.push(sphere);
    });

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener('click', (event) => {
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(specialStars);
        if (intersects.length > 0) {
            openModal(intersects[0].object.userData);
        }
    });

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight; 
        camera.updateProjectionMatrix(); 
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const clock = new THREE.Clock();
    function animate() {
        requestAnimationFrame(animate);
        starParticles.rotation.y = clock.getElapsedTime() * 0.01;
        controls.update();
        renderer.render(scene, camera);
    }
    animate();

    const modal = document.getElementById('info-modal');
    const vName = document.getElementById('star-name');
    const vMedia = document.getElementById('star-media'); 
    const vDesc = document.getElementById('star-desc');
    const closeBtn = document.getElementById('close-btn');

    function openModal(starData) {
        vName.innerText = starData.name;
        vDesc.innerText = starData.desc;
        vMedia.src = starData.mediaUrl;
        modal.style.display = 'block';
    }

    closeBtn.addEventListener('click', () => {
        modal.style.display = 'none';
        vMedia.src = ''; 
    });
</script>

</body>
</html>
