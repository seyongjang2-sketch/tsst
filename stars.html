<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ 무한한 상상력의 우주 탐험대 ✨</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #000; font-family: 'Malgun Gothic', 'Comic Sans MS', sans-serif; }
        
        #info-modal { 
            display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            width: 90%; max-width: 600px; background: linear-gradient(135deg, rgba(15, 20, 40, 0.98), rgba(30, 10, 35, 0.98)); 
            border: 3px solid #00ffff; border-radius: 25px; padding: 25px; text-align: center; color: white; 
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.4), inset 0 0 20px rgba(255, 255, 255, 0.1); 
            z-index: 100; animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        @keyframes popIn {
            from { transform: translate(-50%, -40%) scale(0.9); opacity: 0; }
            to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        #info-modal h2 { margin: 0 0 15px 0; color: #00ffff; font-size: 30px; text-shadow: 0 0 10px rgba(0, 255, 255, 0.6); }
        
        /* 외부 파일 에러 원천 차단: HTML5 마법 캔버스 */
        #star-canvas { 
            width: 100%; height: 260px; border-radius: 15px; border: 2px dashed #4488ff; 
            background: radial-gradient(circle, #0a1128 0%, #000005 100%); 
            margin-bottom: 15px; display: block; box-shadow: inset 0 0 30px #000; 
        }
        
        #star-desc { font-size: 18px; line-height: 1.7; word-break: keep-all; margin: 10px 0 25px 0; color: #eef; }
        
        .close-btn { 
            padding: 12px 35px; font-size: 18px; font-weight: bold; background: linear-gradient(135deg, #00ffff, #0088ff); 
            color: #000; border: none; border-radius: 40px; cursor: pointer; transition: 0.3s; 
            box-shadow: 0 5px 15px rgba(0, 255, 255, 0.3);
        }
        .close-btn:hover { transform: scale(1.05); color: #fff; box-shadow: 0 8px 25px rgba(0, 255, 255, 0.6); }
        
        #guide { position: absolute; top: 15px; left: 15px; color: rgba(255,255,255,0.9); pointer-events: none; font-size: 15px; text-shadow: 1px 1px 3px black; z-index: 10; font-weight: bold; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 10px; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #00ffff; font-size: 22px; font-weight: bold; }
    </style>
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
    </script>
</head>
<body>

<div id="loading">🌌 10,000개의 별을 생성하는 중...</div>
<div id="guide">🚀 우주 회전: 드래그 | 확대: 휠<br>⭐ 밤하늘의 '모든 점(별)'을 클릭해 보세요!</div>

<div id="info-modal">
    <h2 id="star-name">별 이름</h2>
    <canvas id="star-canvas" width="600" height="260"></canvas>
    <p id="star-desc">설명</p>
    <button class="close-btn" id="close-btn">다시 우주로 🚀</button>
</div>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    document.getElementById('loading').style.display = 'none';

    // 1. 기본 씬 구성
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x020205, 0.0006);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 4000);
    camera.position.set(0, 50, 400);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // 2. 10,000개의 점(Particle)으로 구성된 은하수 생성
    const PARTICLE_COUNT = 10000;
    const starsGeometry = new THREE.BufferGeometry();
    const posArray = new Float32Array(PARTICLE_COUNT * 3);
    const colorsArray = new Float32Array(PARTICLE_COUNT * 3);
    const colorObj = new THREE.Color();

    for(let i = 0; i < PARTICLE_COUNT; i++) { 
        // 우주 공간에 무작위 배치
        posArray[i*3] = (Math.random() - 0.5) * 3000;
        posArray[i*3+1] = (Math.random() - 0.5) * 3000;
        posArray[i*3+2] = (Math.random() - 0.5) * 3000;

        // 별의 온도(색상) 무작위 지정 (푸른색, 붉은색, 노란색, 하얀색)
        const rand = Math.random();
        if(rand < 0.2) colorObj.setHex(0x44aaff); // 아주 뜨거운 푸른 별
        else if(rand < 0.4) colorObj.setHex(0xff5533); // 식어가는 붉은 거성
        else if(rand < 0.7) colorObj.setHex(0xffdd55); // 태양 같은 노란 별
        else colorObj.setHex(0xffffff); // 눈부신 백색 왜성

        colorsArray[i*3] = colorObj.r;
        colorsArray[i*3+1] = colorObj.g;
        colorsArray[i*3+2] = colorObj.b;
    }
    
    starsGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    starsGeometry.setAttribute('color', new THREE.BufferAttribute(colorsArray, 3));

    // 클릭 판정을 위해 PointMaterial의 크기를 살짝 키움
    const starMaterial = new THREE.PointsMaterial({ size: 4.0, vertexColors: true, transparent: true, opacity: 0.9 });
    const starParticles = new THREE.Points(starsGeometry, starMaterial);
    scene.add(starParticles);

    // 3. 레이캐스터 (마우스 클릭 판정) 설정
    const raycaster = new THREE.Raycaster();
    // 점(Point) 클릭 판정 범위를 넓혀주어 아이들이 클릭하기 쉽게 만듦
    raycaster.params.Points.threshold = 5.0; 
    const mouse = new THREE.Vector2();

    window.addEventListener('click', (event) => {
        if(event.target.closest('#info-modal')) return;

        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        
        // 메쉬가 아닌 1만개의 파티클 시스템 자체를 검사
        const intersects = raycaster.intersectObject(starParticles);
        
        if (intersects.length > 0) {
            // 가장 가까운 별의 고유 인덱스(0 ~ 9999) 추출
            const starIndex = intersects[0].index;
            generateProceduralStarData(starIndex);
        }
    });

    // 4. [핵심] 절차적 데이터 생성기 (1만 개의 고유한 이야기 창조)
    function generateProceduralStarData(index) {
        // 인덱스 기반으로 고정된 난수 생성 (같은 별을 누르면 항상 같은 데이터가 나오도록)
        const pseudoRandom = (index * 137.5) % 1; 

        // 1) 고유 이름 생성 (예: 행성 X-402, 알파 99)
        const prefixes = ["알파", "케플러", "안드로메다", "오리온", "시그너스", "글리제", "노바"];
        const namePrefix = prefixes[Math.floor(pseudoRandom * prefixes.length)];
        const starName = `${namePrefix} 구역의 별 번호 ${index + 1}`;

        // 2) 색상 데이터 복구 (해당 파티클의 색상을 가져옴)
        const r = colorsArray[index * 3];
        const g = colorsArray[index * 3 + 1];
        const b = colorsArray[index * 3 + 2];
        const colorHex = (Math.floor(r * 255) << 16) + (Math.floor(g * 255) << 8) + Math.floor(b * 255);

        // 3) 색상에 따른 맞춤형 동화책 설명 조합
        let colorDesc = "";
        let featureDesc = "";

        if (r > 0.8 && b < 0.5) { // 붉은 계열
            colorDesc = "수명이 다해가서 엄청나게 부풀어 오른 붉은색 할아버지 별이네!";
            featureDesc = ["이곳엔 용암이 끓어오르는 화산 행성이 숨어 있을지도 몰라.", "너무 커져서 언젠가 펑! 하고 우주 불꽃놀이를 할 거야."][index % 2];
        } else if (b > 0.8 && r < 0.5) { // 푸른 계열
            colorDesc = "우와! 태양보다 수십 배나 뜨거워서 파란 불꽃을 내뿜는 젊고 힘센 별이야.";
            featureDesc = ["우주 탐험가들이 여기서 빛의 에너지를 충전한대.", "주변에 푸른 얼음으로 덮인 얼음 왕국 행성이 돌고 있을지도 몰라."][index % 2];
        } else if (r > 0.8 && g > 0.8 && b < 0.5) { // 노란 계열
            colorDesc = "우리 지구를 비춰주는 태양과 아주 비슷한 따뜻한 노란색 별이구나.";
            featureDesc = ["이 별 주변에는 외계인 친구들이 살고 있는 제2의 지구가 있을 확률이 아주 높아!", "따스한 빛 덕분에 우주 식물들이 자라나고 있을지도 모르지."][index % 2];
        } else { // 백색
            colorDesc = "다이아몬드처럼 하얗고 눈부시게 빛나는 작고 단단한 백색 왜성이야.";
            featureDesc = ["마법의 힘을 가진 우주 요정들이 이 빛을 타고 여행한다는 전설이 있어.", "별이 남긴 마지막 반짝임이라 더욱 소중하고 아름다워."][index % 2];
        }

        const finalDesc = `${colorDesc} ${featureDesc}`;

        // 모달창 열기
        openModal(starName, finalDesc, colorHex);
    }

    // 5. 모달 및 캔버스 렌더링
    const modal = document.getElementById('info-modal');
    const vName = document.getElementById('star-name');
    const vDesc = document.getElementById('star-desc');
    const closeBtn = document.getElementById('close-btn');
    const canvas = document.getElementById('star-canvas');
    const ctx = canvas.getContext('2d');

    function drawProceduralCanvas(hexColor) {
        const width = canvas.width;
        const height = canvas.height;
        const cx = width / 2;
        const cy = height / 2;

        ctx.clearRect(0, 0, width, height);

        // 배경 별가루
        for(let i = 0; i < 40; i++) {
            ctx.fillStyle = `rgba(255, 255, 255, ${Math.random()})`;
            ctx.beginPath(); ctx.arc(Math.random() * width, Math.random() * height, Math.random() * 1.5, 0, Math.PI * 2); ctx.fill();
        }

        // 선택된 별의 빛 번짐 렌더링
        const r = (hexColor >> 16) & 255;
        const g = (hexColor >> 8) & 255;
        const b = hexColor & 255;
        const rgbString = `${r}, ${g}, ${b}`;

        const glow = ctx.createRadialGradient(cx, cy, 10, cx, cy, 120);
        glow.addColorStop(0, `rgba(255, 255, 255, 1)`);
        glow.addColorStop(0.2, `rgba(${rgbString}, 0.8)`);
        glow.addColorStop(0.6, `rgba(${rgbString}, 0.2)`);
        glow.addColorStop(1, `rgba(${rgbString}, 0)`);

        ctx.fillStyle = glow;
        ctx.beginPath(); ctx.arc(cx, cy, 120, 0, Math.PI * 2); ctx.fill();
    }

    function openModal(name, desc, color) {
        vName.innerText = name;
        vDesc.innerText = desc;
        drawProceduralCanvas(color);
        modal.style.display = 'block';
    }

    closeBtn.addEventListener('click', () => {
        modal.style.display = 'none';
    });

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
        requestAnimationFrame(animate);
        starParticles.rotation.y += 0.0005;
        controls.update();
        renderer.render(scene, camera);
    }
    animate();
</script>

</body>
</html>
