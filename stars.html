<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>우리 아기 밤하늘 - FamilySpace</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="login-modal.css" />
    <script src="auth.js"></script>
    <style>
      body { margin: 0; overflow: hidden; background: #000; }
      canvas { display: block; }
      .sky-ui {
        position: absolute; top: 100px; left: 50%; transform: translateX(-50%);
        text-align: center; color: white; pointer-events: none; width: 100%;
      }
      .sky-ui h1 { font-size: 2.5rem; text-shadow: 0 0 20px rgba(255,255,255,0.8); margin-bottom: 10px; }
      .sky-ui p { font-size: 1.1rem; opacity: 0.8; }
      .constellation-hint {
        position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
        color: rgba(255,255,255,0.5); font-size: 0.9rem; text-align: center;
      }
      .back-btn {
        position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.1);
        color: white; border: 1px solid rgba(255,255,255,0.3); padding: 10px 20px;
        border-radius: 50px; text-decoration: none; backdrop-filter: blur(5px);
      }
    </style>
  </head>
  <body>
    <canvas id="starCanvas"></canvas>
    
    <div class="sky-ui">
      <h1>우리 아기의 꿈꾸는 밤하늘 🌌</h1>
      <p>하늘을 문질러 별자리를 그려보세요</p>
    </div>

    <div class="constellation-hint">
      마우스를 움직이거나 화면을 터치하면 별들이 따라와요.<br>
      가끔 떨어지는 유성을 보며 소원을 빌어보세요!
    </div>

    <a href="index.html" class="back-btn">돌아가기</a>

    <script>
      const canvas = document.getElementById('starCanvas');
      const ctx = canvas.getContext('2d');
      let stars = [];
      let meteors = [];
      let mouse = { x: null, y: null };

      function init() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        stars = [];
        for (let i = 0; i < 400; i++) {
          stars.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 2,
            opacity: Math.random(),
            speed: 0.01 + Math.random() * 0.02
          });
        }
      }

      function draw() {
        ctx.fillStyle = '#000510';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        stars.forEach(star => {
          ctx.fillStyle = 'rgba(255, 255, 255, ' + star.opacity + ')';
          ctx.beginPath();
          ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
          ctx.fill();
          
          star.opacity += star.speed;
          if (star.opacity > 1 || star.opacity < 0) star.speed *= -1;
        });

        // Mouse trace (Constellation)
        if (mouse.x && mouse.y) {
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
          ctx.lineWidth = 1;
          stars.forEach(star => {
            let dist = Math.hypot(star.x - mouse.x, star.y - mouse.y);
            if (dist < 100) {
              ctx.beginPath();
              ctx.moveTo(mouse.x, mouse.y);
              ctx.lineTo(star.x, star.y);
              ctx.stroke();
            }
          });
        }

        // Meteors
        if (Math.random() < 0.01) {
          meteors.push({
            x: Math.random() * canvas.width,
            y: 0,
            len: 100 + Math.random() * 100,
            speed: 10 + Math.random() * 10
          });
        }

        meteors.forEach((m, i) => {
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(m.x, m.y);
          ctx.lineTo(m.x - m.len, m.y + m.len);
          ctx.stroke();
          m.x += m.speed;
          m.y += m.speed;
          if (m.y > canvas.height) meteors.splice(i, 1);
        });

        requestAnimationFrame(draw);
      }

      window.addEventListener('mousemove', e => { mouse.x = e.x; mouse.y = e.y; });
      window.addEventListener('touchstart', e => { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; });
      window.addEventListener('touchmove', e => { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; });
      window.addEventListener('resize', init);

      init();
      draw();
    </script>
  </body>
</html>
