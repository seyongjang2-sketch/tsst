<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우주 탐험 - FamilySpace</title>
    <style>
        /* 모바일 터치 시 화면이 튕기는 현상을 막는 핵심 방어 코드 */
        body { margin: 0; padding: 0; overflow: hidden; background-color: #000; font-family: 'Malgun Gothic', sans-serif; touch-action: none; }
        
        /* 홈으로 돌아가기 버튼 (FamilySpace 연동) */
        .back-home-btn {
            position: absolute; top: 20px; left: 20px; z-index: 50; padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1); border: 2px solid #fff; border-radius: 30px;
            color: #fff; text-decoration: none; font-weight: bold; font-size: 16px;
            backdrop-filter: blur(5px); transition: 0.3s; box-shadow: 0 0 10px rgba(255,255,255,0.2);
        }
        .back-home-btn:hover { background: #fff; color: #000; box-shadow: 0 0 20px rgba(255,255,255,0.8); }

        /* 모달창 스타일 */
        #info-modal { 
            display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            width: 90%; max-width: 600px; background: linear-gradient(135deg, rgba(15, 20, 40, 0.98), rgba(30, 10, 35, 0.98)); 
            border: 3px solid #00ffff; border-radius: 25px; padding: 25px; text-align: center; color: white; 
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.4), inset 0 0 20px rgba(255, 255, 255, 0.1); 
            z-index: 100; animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            from { transform: translate(-50%, -40%) scale(0.9); opacity: 0; }
            to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
        #info-modal h2 { margin: 0 0 15px 0; color: #00ffff; font-size: 28px; text-shadow: 0 0 10px rgba(0, 255, 255, 0.6); }
        
        #star-canvas { width: 100%; height: 240px; border-radius: 15px; border: 2px dashed #4488ff; background: radial-gradient(circle, #0a1128 0%, #000005 100%); margin-bottom: 15px; display: block; box-shadow: inset 0 0 30px #000; }
        
        /* 스크롤 가능한 스토리텔링 텍스트 영역 */
        #star-desc { 
            font-size: 17px; line-height: 1.8; word-break: keep-all; margin: 15px 0 20px 0; color: #eef; text-align: left;
            max-height: 200px; overflow-y: auto; padding-right: 15px; background: rgba(0, 0, 0, 0.3); border-radius: 15px; padding: 15px;
        }
        #star-desc::-webkit-scrollbar { width: 8px; }
        #star-desc::-webkit-scrollbar-thumb { background: #ffcc00; border-radius: 10px; }
        
        .story-title { color: #ffd700; font-size: 19px; font-weight: bold; display: block; margin-top: 15px; margin-bottom: 5px; }
        .science-fact { color: #00ffff; font-weight: bold; }

        .close-btn { padding: 12px 35px; font-size: 18px; font-weight: bold; background: linear-gradient(135deg, #00ffff, #0088ff); color: #000; border: none; border-radius: 40px; cursor: pointer; transition: 0.3s; box-shadow: 0 5px 15px rgba(0, 255, 255, 0.3); }
        .close-btn:hover { transform: scale(1.05); color: #fff; box-shadow: 0 8px 25px rgba(0, 255, 255, 0.6); }
        
        #guide { position: absolute; top: 70px; left: 20px; color: rgba(255,255,255,0.9); pointer-events: none; font-size: 15px; text-shadow: 1px 1px 3px black; z-index: 10; font-weight: bold; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 10px; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #00ffff; font-size: 22px; font-weight: bold; }

        /* 검색창 UI */
        #search-container { position: absolute; top: 20px; right: 20px; width: 300px; z-index: 50; }
        #search-input { width: 100%; padding: 12px 20px; font-size: 16px; font-family: inherit; background: rgba(10, 15, 30, 0.8); border: 2px solid #00ffff; border-radius: 30px; color: #fff; outline: none; box-sizing: border-box; box-shadow: 0 0 15px rgba(0,255,255,0.2); transition: 0.3s; }
        #search-input:focus { background: rgba(20, 30, 50, 0.95); box-shadow: 0 0 20px rgba(0,255,255,0.6); }
        #search-input::placeholder { color: rgba(255,255,255,0.5); }
        
        #search-results { margin-top: 10px; background: rgba(10, 15, 30, 0.95); border-radius: 15px; border: 1px solid #4488ff; max-height: 250px; overflow-y: auto; display: none; }
        .search-item { padding: 12px 20px; color: #00ffff; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 15px; transition: 0.2s; }
        .search-item:last-child { border-bottom: none; }
        .search-item:hover { background: rgba(0, 255, 255, 0.2); color: #fff; }
        .special-star { color: #ffd700; font-weight: bold; }
        .special-star::before { content: "⭐ "; }
        #search-results::-webkit-scrollbar { width: 8px; }
        #search-results::-webkit-scrollbar-thumb { background: #00ffff; border-radius: 10px; }
    </style>
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
    </script>
</head>
<body>

<a href="index.html" class="back-home-btn">🏠 홈으로 돌아가기</a>

<div id="loading">🌌 우주를 불러오는 중...</div>
<div id="guide">🚀 우주 회전: 화면 드래그<br>🔍 천체를 터치하거나 검색해보세요!</div>

<div id="search-container">
    <input type="text" id="search-input" placeholder="🔍 천체 검색 (예: 지구, 목성)" autocomplete="off">
    <div id="search-results"></div>
</div>

<div id="info-modal">
    <h2 id="star-name">별 이름</h2>
    <canvas id="star-canvas" width="600" height="240"></canvas>
    <div id="star-desc">설명</div>
    <button class="close-btn" id="close-btn">다시 우주로 🚀</button>
</div>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    document.getElementById('loading').style.display = 'none';

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x020205, 0.0006);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 4000);
    camera.position.set(0, 50, 400);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // 모바일 최적화 (픽셀 비율 제한)
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxDistance = 1500; // 우주 밖으로 이탈 방지

    function createGlowingStarTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 64; canvas.height = 64;
        const context = canvas.getContext('2d');
        const gradient = context.createRadialGradient(32, 32, 0, 32, 32, 32);
        gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
        gradient.addColorStop(0.2, 'rgba(255, 255, 255, 0.8)');
        gradient.addColorStop(0.5, 'rgba(255, 255, 255, 0.2)');
        gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
        context.fillStyle = gradient; context.fillRect(0, 0, 64, 64);
        return new THREE.CanvasTexture(canvas);
    }
    const glowTexture = createGlowingStarTexture();

    // 15대 랜드마크 천체 메타데이터
    const specialBodies = [
        { name: "태양 (The Sun)", color: 0xFFDD44, desc: "<span class='science-fact'>[우주 사전]</span> 태양계 중심에 있는 G형 주계열성입니다. 지구보다 109배나 크고 표면 온도는 6,000도에 달해요.<br><span class='story-title'>📖 아폴론의 황금 마차</span> 옛날 그리스 사람들은 태양이 하늘을 날아다니는 빛나는 황금 마차라고 생각했어. 매일 아침 태양의 신 '아폴론'이 불을 뿜는 말 네 마리가 끄는 마차를 타고 동쪽 하늘에서 출발해 세상을 따뜻하게 비춰준다고 믿었단다." },
        { name: "수성 (Mercury)", color: 0xAAAAAA, desc: "<span class='science-fact'>[우주 사전]</span> 태양에서 가장 가까운 행성으로, 대기가 없어서 운석 구덩이(크레이터)가 아주 많습니다.<br><span class='story-title'>📖 발이 가장 빠른 꼬마 우체부</span> 태양 곁을 쌩쌩 날아다니는 수성은 로마 신화에서 날개 달린 신발을 신은 전령의 신 '메르쿠리우스(머큐리)'의 이름을 땄어. 우주의 소식을 가장 먼저 전해주는 꼬마 우체부 요정이란다." },
        { name: "금성 (Venus)", color: 0xFFBB66, desc: "<span class='science-fact'>[우주 사전]</span> 밤하늘에서 달 다음으로 밝은 행성입니다. 두꺼운 이산화탄소 구름 때문에 태양계에서 가장 뜨거워요.<br><span class='story-title'>📖 아름다움의 여신과 샛별</span> 금성은 너무 눈부시게 반짝여서 미의 여신 '비너스'라는 이름을 가졌어. 하지만 구름 이불을 꽁꽁 덮고 있어서 속은 용암이 끓어오르는 무시무시한 마법의 성이야." },
        { name: "지구 (Earth)", color: 0x44AAFF, desc: "<span class='science-fact'>[우주 사전]</span> 우리가 살고 있는 기적의 행성입니다. 표면의 70%가 바다로 덮여 있어 생명체가 살 수 있죠.<br><span class='story-title'>📖 가이아 어머니의 품</span> 아주 먼 옛날, 우주에 흙과 물을 빚어 만든 생명의 여신 '가이아'가 있었어. 가이아는 숨을 크게 불어넣어 푸른 바다와 초록색 숲을 만들고, 우리를 품어주었지." },
        { name: "달 (The Moon)", color: 0xDDDDDD, desc: "<span class='science-fact'>[우주 사전]</span> 지구를 도는 유일한 자연 위성입니다. 스스로 빛을 내지 못하고 태양빛을 반사해서 빛나요.<br><span class='story-title'>📖 달나라 옥토끼의 방아찧기</span> 옛날 우리나라 사람들은 보름달을 보며 달나라에 귀여운 옥토끼가 살고 있다고 믿었어. 계수나무 아래에서 쿵덕쿵덕 마법 구슬을 만들고 있다는 전설이 전해져 내려온단다." },
        { name: "화성 (Mars)", color: 0xFF4422, desc: "<span class='science-fact'>[우주 사전]</span> 붉은 산화철 먼지로 덮여 있어 붉게 보이는 행성입니다. 올림푸스 화산이라는 태양계 최고 높이의 산이 있어요.<br><span class='story-title'>📖 큐리오시티의 모험</span> 지금 화성에는 '큐리오시티'라는 씩씩한 로봇 탐사선이 혼자서 윙윙 바퀴를 굴리며 옛날에 물이 있었던 흔적을 찾아 모험을 하고 있단다." },
        { name: "목성 (Jupiter)", color: 0xDDAA88, desc: "<span class='science-fact'>[우주 사전]</span> 태양계에서 가장 크고 무거운 가스 행성입니다. 표면의 거대한 태풍인 '대적점'이 특징이에요.<br><span class='story-title'>📖 신들의 왕, 쥬피터</span> 덩치가 가장 커서 로마 신화 최고의 신 '주피터(제우스)'의 이름을 따왔어. 목성의 빨간 눈동자는 무려 300년이 넘게 쉬지 않고 휘몰아치는 우주의 거대한 마법 태풍이야!" },
        { name: "토성 (Saturn)", color: 0xFFEEAA, desc: "<span class='science-fact'>[우주 사전]</span> 밀도가 낮아 물에 뜨는 행성입니다. 수많은 얼음과 암석 조각으로 이루어진 거대한 고리가 있어요.<br><span class='story-title'>📖 우주의 멋쟁이 훌라후프 챔피언</span> 토성은 우주에서 가장 예쁜 훌라후프를 돌리고 있어. 사실 수억 개의 반짝이는 얼음 알갱이들이 요정의 가루처럼 빛나고 있는 거란다." },
        { name: "천왕성 (Uranus)", color: 0x66DDFF, desc: "<span class='science-fact'>[우주 사전]</span> 메탄가스 때문에 에메랄드빛으로 보이는 얼음 행성입니다. 자전축이 98도나 기울어져 있어요.<br><span class='story-title'>📖 벌러덩 누워서 구르는 얼음 별</span> 다른 행성들은 팽이처럼 똑바로 서서 도는데, 천왕성 혼자만 옆으로 벌러덩 누워서 대굴대굴 굴러가고 있어. 아주 먼 옛날 혜성과 부딪혀서 넘어졌다는 이야기가 있단다." },
        { name: "해왕성 (Neptune)", color: 0x2244FF, desc: "<span class='science-fact'>[우주 사전]</span> 태양계의 맨 마지막 행성입니다. 가장 강하고 빠른 바람이 부는 아주 차가운 파란색 행성이에요.<br><span class='story-title'>📖 바다의 신 포세이돈의 얼음 왕국</span> 짙은 푸른색을 띠고 있어서 바다의 신 '넵튠(포세이돈)'이라는 이름이 붙었어. 너무 추워서 다이아몬드 우박이 펑펑 쏟아진다는 마법 같은 과학 이야기도 있단다." },
        { name: "명왕성 (Pluto)", color: 0xBBBBBB, desc: "<span class='science-fact'>[우주 사전]</span> 과거에는 9번째 행성이었으나 2006년에 '왜소행성'으로 분류가 바뀌었어요.<br><span class='story-title'>📖 하트(❤)를 품은 꼬마 별</span> 몸집이 작아서 행성 무리에서는 빠지게 되었지만, 탐사선이 사진을 찍어보니 배에 커다랗고 예쁜 하트 무늬가 그려져 있었어. 우주를 사랑하는 따뜻한 꼬마 별이지." },
        { name: "북극성 (Polaris)", color: 0xFFF4E8, desc: "<span class='science-fact'>[우주 사전]</span> 지구 자전축의 연장선에 위치해 있어 밤하늘에서 항상 북쪽을 가리키는 별입니다.<br><span class='story-title'>📖 길잡이 요정</span> 작은곰자리의 꼬리 끝에 매달려 있는 우주의 나침반 요정이야. 어두운 밤바다에서 길을 잃은 선장님이 북극성을 보고 항상 집을 찾아갈 수 있었대." },
        { name: "시리우스 (Sirius)", color: 0x88CCFF, desc: "<span class='science-fact'>[우주 사전]</span> 밤하늘의 항성 중 가장 밝아 눈부시게 빛나는 주계열성입니다.<br><span class='story-title'>📖 오리온의 파란 강아지</span> 전설 속 사냥꾼 '오리온'을 따라다니던 충성스러운 사냥개 별이야. 주인을 지키기 위해 밤하늘에서 두 눈을 푸르게 빛내며 우주를 지키고 있단다." },
        { name: "베텔게우스 (Betelgeuse)", color: 0xFF3311, desc: "<span class='science-fact'>[우주 사전]</span> 오리온자리의 붉은색 초거성입니다. 크기가 너무 커서 태양의 자리에 두면 목성의 궤도까지 삼킬 정도예요.<br><span class='story-title'>📖 폭발을 기다리는 붉은 거인</span> 하늘에서 가장 크고 뚱뚱한 할아버지 별이야. 우주 과학자들은 조만간 '펑!' 하고 거대하게 터지는 마법의 불꽃놀이(초신성)를 보여줄 거라고 기대하고 있어." },
        { name: "안타레스 (Antares)", color: 0xFF2200, desc: "<span class='science-fact'>[우주 사전]</span> 전갈자리의 심장에 위치한 적색 초거성입니다. 화성(Ares)과 색깔이 비슷하여 '화성의 라이벌'이란 뜻을 가졌습니다.<br><span class='story-title'>📖 화성을 질투한 전갈의 심장</span> 붉게 빛나는 화성을 보고 질투한 거대한 전갈 요정이 자신의 심장을 더 뜨겁게 불태웠대. 그래서 여름 밤하늘 전갈의 가슴 한가운데서 무시무시한 붉은 빛이 뛰고 있단다." }
    ];

    const PARTICLE_COUNT = 10000;
    const starsGeometry = new THREE.BufferGeometry();
    const posArray = new Float32Array(PARTICLE_COUNT * 3);
    const colorsArray = new Float32Array(PARTICLE_COUNT * 3);
    const colorObj = new THREE.Color();
    
    const starDatabase = [];
    const prefixes = ["알파", "케플러", "안드로메다", "오리온", "시그너스", "글리제", "노바"];

    for(let i = 0; i < PARTICLE_COUNT; i++) { 
        let x, y, z;
        if (i < specialBodies.length) {
            x = (Math.random() - 0.5) * 500; y = (Math.random() - 0.5) * 500; z = (Math.random() - 0.5) * 500;
        } else {
            x = (Math.random() - 0.5) * 3000; y = (Math.random() - 0.5) * 3000; z = (Math.random() - 0.5) * 3000;
        }
        posArray[i*3] = x; posArray[i*3+1] = y; posArray[i*3+2] = z;

        let starName, hexColor, isSpecial = false;

        if (i < specialBodies.length) {
            hexColor = specialBodies[i].color;
            starName = specialBodies[i].name;
            isSpecial = true;
        } else {
            const rand = Math.random();
            if(rand < 0.2) hexColor = 0x66bbff;
            else if(rand < 0.4) hexColor = 0xff7755;
            else if(rand < 0.7) hexColor = 0xffee88;
            else hexColor = 0xffffff;

            const pseudoRandom = (i * 137.5) % 1; 
            const namePrefix = prefixes[Math.floor(pseudoRandom * prefixes.length)];
            starName = `${namePrefix} 구역의 반짝이는 별 ${i + 1 - specialBodies.length}`;
        }

        colorObj.setHex(hexColor);
        colorsArray[i*3] = colorObj.r; colorsArray[i*3+1] = colorObj.g; colorsArray[i*3+2] = colorObj.b;
        
        starDatabase.push({ index: i, name: starName, x: x, y: y, z: z, hex: hexColor, isSpecial: isSpecial });
    }
    
    starsGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    starsGeometry.setAttribute('color', new THREE.BufferAttribute(colorsArray, 3));

    const starMaterial = new THREE.PointsMaterial({ 
        size: 8.0, map: glowTexture, vertexColors: true, transparent: true, opacity: 0.9,
        depthWrite: false, blending: THREE.AdditiveBlending 
    });
    const starParticles = new THREE.Points(starsGeometry, starMaterial);
    scene.add(starParticles);

    // 카메라 비행 시스템
    let isFlying = false;
    let targetCameraPos = new THREE.Vector3();
    let targetLookAtPos = new THREE.Vector3();

    const searchInput = document.getElementById('search-input');
    const searchResults = document.getElementById('search-results');

    searchInput.addEventListener('input', (e) => {
        const query = e.target.value.trim().toLowerCase();
        searchResults.innerHTML = ''; 
        if (query.length === 0) { searchResults.style.display = 'none'; return; }

        const matchedStars = starDatabase.filter(star => star.name.toLowerCase().includes(query))
                                         .sort((a, b) => (a.isSpecial === b.isSpecial) ? 0 : a.isSpecial ? -1 : 1)
                                         .slice(0, 30);

        if (matchedStars.length > 0) {
            matchedStars.forEach(star => {
                const div = document.createElement('div');
                div.className = star.isSpecial ? 'search-item special-star' : 'search-item';
                div.innerText = star.name;
                div.onclick = () => executeSearchAndFly(star);
                searchResults.appendChild(div);
            });
            searchResults.style.display = 'block';
        } else {
            const div = document.createElement('div');
            div.className = 'search-item';
            div.innerText = "검색 결과가 없습니다.";
            searchResults.appendChild(div);
            searchResults.style.display = 'block';
        }
    });

    function executeSearchAndFly(star) {
        searchInput.value = ''; searchResults.style.display = 'none';
        targetLookAtPos.set(star.x, star.y, star.z);
        targetCameraPos.set(star.x, star.y, star.z + 80);
        isFlying = true;
        setTimeout(() => { generateProceduralStarData(star.index); }, 1200); 
    }

    // 클릭 판정 시스템
    const raycaster = new THREE.Raycaster();
    raycaster.params.Points.threshold = 8.0;
    const mouse = new THREE.Vector2();

    window.addEventListener('pointerdown', (event) => {
        if(event.target.closest('#info-modal') || event.target.closest('#search-container') || event.target.closest('.back-home-btn')) return;

        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        
        const intersects = raycaster.intersectObject(starParticles);
        if (intersects.length > 0) { generateProceduralStarData(intersects[0].index); }
    });

    function generateProceduralStarData(index) {
        const star = starDatabase[index];
        let finalDesc = "";
        
        if (star.isSpecial) {
            finalDesc = specialBodies[index].desc;
        } else {
            const r = (star.hex >> 16) & 255; const g = (star.hex >> 8) & 255; const b = star.hex & 255;
            let colorDesc = "", featureDesc = "";
            if (r > 200 && b < 120) { colorDesc = "수명이 다해가서 부풀어 오른 거대한 붉은색 별이네!"; featureDesc = "용암이 끓어오르는 화산 행성이 숨어 있을지도 몰라."; } 
            else if (b > 200 && r < 120) { colorDesc = "우와! 태양보다 훨씬 뜨거워서 파란 불꽃을 내뿜는 젊고 힘센 별이야."; featureDesc = "우주 탐험가들이 여기서 빛의 에너지를 충전한대."; } 
            else if (r > 200 && g > 200 && b < 150) { colorDesc = "우리 지구를 비춰주는 태양과 아주 비슷한 따뜻한 노란색 별이구나."; featureDesc = "이 별 주변에는 외계인 친구들이 살고 있을 확률이 높아!"; } 
            else { colorDesc = "다이아몬드처럼 하얗고 눈부시게 빛나는 작고 단단한 백색 왜성이야."; featureDesc = "우주 요정들이 이 빛을 타고 여행한다는 전설이 있어."; }
            finalDesc = `${colorDesc} ${featureDesc}`;
        }
        openModal(star.name, finalDesc, star.hex);
    }

    const modal = document.getElementById('info-modal');
    const vName = document.getElementById('star-name');
    const vDesc = document.getElementById('star-desc');
    const closeBtn = document.getElementById('close-btn');
    const canvas = document.getElementById('star-canvas');
    const ctx = canvas.getContext('2d');

    function drawProceduralCanvas(hexColor) {
        const cx = canvas.width / 2, cy = canvas.height / 2;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for(let i = 0; i < 40; i++) {
            ctx.fillStyle = `rgba(255, 255, 255, ${Math.random()})`;
            ctx.beginPath(); ctx.arc(Math.random() * canvas.width, Math.random() * canvas.height, Math.random() * 2.0, 0, Math.PI * 2); ctx.fill();
        }

        const rgbString = `${(hexColor >> 16) & 255}, ${(hexColor >> 8) & 255}, ${hexColor & 255}`;
        const glow = ctx.createRadialGradient(cx, cy, 10, cx, cy, 120);
        glow.addColorStop(0, `rgba(255, 255, 255, 1)`);
        glow.addColorStop(0.2, `rgba(${rgbString}, 0.8)`);
        glow.addColorStop(0.6, `rgba(${rgbString}, 0.2)`);
        glow.addColorStop(1, `rgba(${rgbString}, 0)`);

        ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(cx, cy, 120, 0, Math.PI * 2); ctx.fill();
    }

    function openModal(name, desc, color) {
        vName.innerText = name; 
        vDesc.innerHTML = desc; 
        drawProceduralCanvas(color); modal.style.display = 'block';
    }

    closeBtn.addEventListener('click', () => { modal.style.display = 'none'; });

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const clock = new THREE.Clock();
    function animate() {
        requestAnimationFrame(animate);
        if (isFlying) {
            camera.position.lerp(targetCameraPos, 0.04);
            controls.target.lerp(targetLookAtPos, 0.04);
            if (camera.position.distanceTo(targetCameraPos) < 2) isFlying = false;
        } else {
            starParticles.rotation.y += 0.0003;
        }
        starMaterial.size = 8.0 + Math.sin(clock.getElapsedTime() * 2.0) * 1.5; 
        controls.update();
        renderer.render(scene, camera);
    }
    animate();
</script>

</body>
</html>
