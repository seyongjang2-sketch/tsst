<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Góc của Mẹ - FamilySpace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
    <style>
      .page-header.mom-header {
        background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('https://images.unsplash.com/photo-1556910103-1c02745aae4d?auto=format&fit=crop&q=80&w=1200');
        background-size: cover;
        background-position: center;
      }
      .action-btn { display: block; width: 100%; padding: 12px; background: var(--mom-color); color: white; text-align: center; border-radius: 8px; text-decoration: none; font-weight: 700; margin-top: 15px; transition: opacity 0.2s; }
      .action-btn:hover { opacity: 0.9; }
      .comment-section { margin-top: 40px; background: white; padding: 30px; border-radius: 20px; box-shadow: var(--shadow); }
      .comment-input-group { display: flex; gap: 10px; margin-bottom: 20px; }
      .comment-input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 8px; outline: none; }
      .comment-list { list-style: none; }
      .comment-item { padding: 15px 0; border-bottom: 1px solid #eee; }
      .comment-author { font-weight: 700; color: var(--mom-color); margin-right: 10px; }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <div class="nav-container">
        <a href="index.html" class="nav-logo">FamilySpace</a>
        <ul class="nav-links">
          <li><a href="index.html">Trang chủ</a></li>
          <li><a href="dad.html">Bố</a></li>
          <li><a href="mom.html">Mẹ</a></li>
          <li><a href="baby.html">Bé</a></li>
        </ul>
      </div>
    </nav>

    <header class="page-header mom-header">
      <h1>Không gian của Mẹ 🌸</h1>
      <p>Nấu ăn, làm đẹp và chăm sóc sức khỏe cho cả gia đình</p>
    </header>

    <div class="main-wrapper">
      <div class="content-grid">
        <div class="content-card">
          <h3>Món ngon mỗi ngày</h3>
          <div class="video-container">
            <iframe src="https://www.youtube.com/embed/videoseries?list=PLm_pY2A9nE6v6-L701ZkI0zT1T_lP8h8h" frameborder="0" allowfullscreen></iframe>
          </div>
          <a href="https://www.1000recipe.com/" target="_blank" class="action-btn">Tìm thêm công thức</a>
        </div>

        <div class="content-card">
          <h3>Bí quyết làm đẹp</h3>
          <img src="https://images.unsplash.com/photo-1596462502278-27bfdc4033c8?auto=format&fit=crop&q=80&w=400" alt="Beauty" style="width: 100%; border-radius: 12px; margin-bottom: 15px;">
          <a href="https://vnexpress.net/lam-dep" target="_blank" class="action-btn">Xem tin tức làm đẹp</a>
        </div>

        <div class="content-card">
          <h3>Sức khỏe của Bé</h3>
          <img src="https://images.unsplash.com/photo-1584622650111-993a426fbf0a?auto=format&fit=crop&q=80&w=400" alt="Health" style="width: 100%; border-radius: 12px; margin-bottom: 15px;">
          <a href="https://bvnhidong.org.vn/" target="_blank" class="action-btn">Thông tin y tế</a>
        </div>
      </div>

      <div class="comment-section">
        <h3>💬 Lời nhắn cho Mẹ</h3>
        <div class="comment-input-group">
          <input type="text" id="comment-input" class="comment-input" placeholder="Lời nhắn...">
          <button onclick="addComment()" class="btn-enter" style="background: var(--mom-color); color: white; border: none; cursor: pointer;">Gửi</button>
        </div>
        <ul id="comment-list" class="comment-list">
          <li class="comment-item"><span class="comment-author">Bố:</span> Yêu mẹ nhiều! ❤️</li>
        </ul>
      </div>
    </div>

    <script>
      function addComment() {
        const input = document.getElementById('comment-input');
        const list = document.getElementById('comment-list');
        if (input.value.trim()) {
          const li = document.createElement('li');
          li.className = 'comment-item';
          li.innerHTML = '<span class="comment-author">Gia đình:</span> ' + input.value;
          list.prepend(li);
          input.value = '';
        }
      }
    </script>
  </body>
</html>
