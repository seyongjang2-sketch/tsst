<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인 - FamilySpace</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      body {
        display: flex; align-items: center; justify-content: center; min-height: 100vh;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); margin: 0; padding: 20px;
      }
      .login-card {
        background: white; padding: 40px; border-radius: 24px; box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        max-width: 400px; width: 100%; text-align: center;
      }
      .login-input {
        width: 100%; padding: 15px; margin: 20px 0; border: 1px solid #ddd; border-radius: 12px;
        font-size: 1rem; outline: none; text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <h1 style="color: #4a90e2; margin-bottom: 10px;">FamilySpace</h1>
      <p style="color: #666;">우리 가족만의 비밀 공간입니다.<br>Hãy nhập mật khẩu gia đình.</p>
      <input type="password" id="pass-input" class="login-input" placeholder="비밀번호 입력" onkeypress="if(event.keyCode==13) login(this.value)">
      <button onclick="login(document.getElementById('pass-input').value)" class="btn-enter" style="background: #4a90e2; color: white; border: none; width: 100%; cursor: pointer;">입장하기 (Vào)</button>
    </div>
    <script src="auth.js"></script>
  </body>
</html>
