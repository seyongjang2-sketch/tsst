<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>프리미엄 로또 번호 생성기</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-wrapper">
      <div class="card">
        <div class="theme-toggle">
          <button id="theme-btn" aria-label="Toggle dark mode">
            <span class="icon-sun">☀️</span>
            <span class="icon-moon">🌙</span>
          </button>
        </div>
        <header>
          <h1>LOTTO 6/45</h1>
          <p class="subtitle">프리미엄 로또 번호 생성기</p>
        </header>

        <section class="intro-section">
          <p>
            매주 행운을 꿈꾸는 당신을 위한 최고의 동반자입니다. 
            <strong>프리미엄 로또 번호 생성기</strong>는 정교한 알고리즘을 통해 
            당신에게 최적의 번호 조합을 제안합니다. 지금 바로 번호를 생성하고 행운의 주인공이 되어보세요!
          </p>
        </section>
        
        <div id="numbers-container" class="numbers-container">
          <!-- 번호 공들이 여기에 생성됩니다 -->
          <div class="placeholder">행운을 불러오는 중...</div>
        </div>

        <div class="actions">
          <button id="generate-btn">번호 생성하기</button>
        </div>
      </div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
