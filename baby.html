<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>아기 놀이터 - FamilySpace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
    <style>
      .page-header.baby-header {
        background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('https://images.unsplash.com/photo-1502086223501-7ea24ec3946d?auto=format&fit=crop&q=80&w=1200');
        background-size: cover; background-position: center;
      }
      .alphabet-board { display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 10px; margin-top: 20px; }
      .letter-btn { width: 60px; height: 60px; background: white; border: 2px solid var(--baby-color); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 700; cursor: pointer; transition: transform 0.1s, background 0.1s; }
      .letter-btn:active { transform: scale(0.9); background: var(--baby-color); color: white; }
      .display-letter { font-size: 4rem; text-align: center; margin: 20px 0; height: 100px; color: var(--baby-color); font-weight: 700; }
      .lang-tab { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
      .tab-btn { padding: 8px 20px; border-radius: 20px; border: 1px solid var(--baby-color); background: white; cursor: pointer; font-weight: 700; }
      .tab-btn.active { background: var(--baby-color); color: white; }
      .action-btn { display: block; width: 100%; padding: 12px; background: var(--baby-color); color: white; text-align: center; border-radius: 8px; text-decoration: none; font-weight: 700; margin-top: 15px; transition: opacity 0.2s; }
      .blog-form { background: white; padding: 25px; border-radius: 20px; box-shadow: var(--shadow); margin-bottom: 30px; }
      .blog-input { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 8px; outline: none; }
      .blog-textarea { width: 100%; height: 120px; padding: 12px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 8px; outline: none; resize: none; }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <div class="nav-container">
        <a href="index.html" class="nav-logo">FamilySpace</a>
        <ul class="nav-links">
          <li><a href="index.html">홈</a></li>
          <li><a href="dad.html">아빠</a></li>
          <li><a href="mom.html">엄마</a></li>
          <li><a href="baby.html">아기</a></li>
        </ul>
      </div>
    </nav>

    <header class="page-header baby-header">
      <h1>우리 아기 놀이터 👶</h1>
      <p>베트남 현지 교육 정보와 성장 일기</p>
    </header>

    <div class="main-wrapper">
      <div class="content-grid">
        <div class="content-card">
          <h3>신나는 동요 세상</h3>
          <div class="video-container">
            <iframe src="https://www.youtube.com/embed/videoseries?list=PL2V6X6qH6P2-p0V0lH5B_OQ9S3T_uI0K8" frameborder="0" allowfullscreen></iframe>
          </div>
          <a href="https://www.youtube.com/@AnChoiCungBe" target="_blank" class="action-btn">베트남 인기 키즈 채널</a>
        </div>

        <div class="content-card">
          <h3>글자 공부 학습판</h3>
          <div class="lang-tab">
            <button class="tab-btn active" onclick="switchLang('kr')">한글</button>
            <button class="tab-btn" onclick="switchLang('vi')">Tiếng Việt</button>
          </div>
          <div id="display-letter" class="display-letter">가</div>
          <div class="alphabet-board" id="alphabet-board"></div>
        </div>

        <div class="content-card">
          <h3>풍선 터뜨리기 놀이</h3>
          <div style="height: 150px; background: #f0fff4; border-radius: 12px; position: relative; overflow: hidden; cursor: crosshair; margin-bottom: 15px;" id="game-area"></div>
          <a href="https://www.tiNiWorld.com/" target="_blank" class="action-btn" style="background: #2ecc71;">tiNiWorld (키즈카페) 바로가기</a>
        </div>
      </div>

      <!-- Blog Section -->
      <section style="margin-top: 60px;">
        <h2 style="margin-bottom: 25px; text-align: center;">📔 우리 아기 성장 일기 (Blog)</h2>
        <div class="blog-form" id="blog-form">
          <input type="text" id="post-title" class="blog-input" placeholder="제목 (Tiêu đề)">
          <textarea id="post-content" class="blog-textarea" placeholder="아기의 소중한 순간을 기록하세요 (Ghi lại khoảnh khắc của bé)"></textarea>
          <button onclick="savePost()" class="btn-enter" style="background: var(--baby-color); color: white; border: none; cursor: pointer; width: 100%;">성장 일기 등록 (Đăng bài)</button>
        </div>
        <div id="blog-posts">
          <!-- Posts will appear here -->
        </div>
      </section>

      <div style="text-align: center; margin-top: 40px;">
        <a href="index.html" class="btn-enter" style="background: var(--baby-color); color: white; text-decoration: none;">메인으로 돌아가기</a>
      </div>
    </div>

    <footer class="footer">
      <div class="footer-content">
        <p>&copy; 2026 FamilySpace. All rights reserved.</p>
      </div>
    </footer>

    <script src="main.js"></script>
    <script>
      var krLetters = '가나다라마바사아자차카타파하';
      var viLetters = 'ABCDEGHIKLMNOPQRSTUVXY';
      var currentLang = 'kr';
      var board = document.getElementById('alphabet-board');
      var display = document.getElementById('display-letter');

      function switchLang(lang) {
        currentLang = lang;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        if (event && event.target) event.target.classList.add('active');
        renderBoard();
        display.textContent = lang === 'kr' ? '가' : 'A';
      }

      function renderBoard() {
        if (!board) return;
        board.innerHTML = '';
        var letters = currentLang === 'kr' ? krLetters : viLetters;
        letters.split('').forEach(function(char) {
          var btn = document.createElement('button');
          btn.className = 'letter-btn';
          btn.textContent = char;
          btn.onclick = function() {
            display.textContent = char;
          };
          board.appendChild(btn);
        });
      }
      renderBoard();

      // Balloon Game
      var gameArea = document.getElementById('game-area');
      function createBalloon() {
        if (!gameArea) return;
        var balloon = document.createElement('div');
        var size = 30 + Math.random() * 20;
        balloon.style.width = size + 'px';
        balloon.style.height = (size * 1.2) + 'px';
        balloon.style.background = 'hsl(' + (Math.random() * 360) + ', 70%, 60%)';
        balloon.style.borderRadius = '50%';
        balloon.style.position = 'absolute';
        balloon.style.left = Math.random() * (gameArea.clientWidth - size) + 'px';
        balloon.style.bottom = '-60px';
        balloon.style.cursor = 'pointer';
        balloon.style.transition = 'bottom 4s linear';
        
        balloon.onclick = function() {
          balloon.style.transform = 'scale(2) rotate(20deg)';
          balloon.style.opacity = '0';
          setTimeout(function() { balloon.remove(); }, 200);
        };

        gameArea.appendChild(balloon);
        setTimeout(function() { balloon.style.bottom = '160px'; }, 10);
        setTimeout(function() { if (balloon.parentNode) balloon.remove(); }, 4000);
      }
      setInterval(createBalloon, 800);
    </script>
  </body>
</html>
