<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>아기 놀이터 - FamilySpace</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="login-modal.css" />
    <script src="auth.js"></script>
  </head>
  <body class="baby-page">
    <nav class="navbar">
      <div class="nav-container">
        <a href="index.html" class="nav-logo">FamilySpace</a>
        <ul class="nav-links">
          <li><a href="index.html">홈</a></li>
          <li><a href="dad.html">아빠</a></li>
          <li><a href="mom.html">엄마</a></li>
          <li><a href="baby.html">아기</a></li>
          <li><a href="blog.html">가족 일기장</a></li>
          <li><a href="#" onclick="logout()" class="logout-btn">로그아웃</a></li>
        </ul>
      </div>
    </nav>

    <div class="main-wrapper">
      <header style="text-align: center; margin-bottom: 40px;">
        <h1 style="font-size: 3rem; color: #27ae60;">Bé (아기)</h1>
        <p>한국어와 베트남어를 함께 배우는 즐거운 놀이터</p>
      </header>

      <div class="content-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 30px;">
        <div class="content-card">
          <h3>글자 공부 학습판</h3>
          <div id="display-letter" style="font-size: 5rem; text-align: center; color: #27ae60; margin: 20px 0; font-weight: 700;">가</div>
          <div id="alphabet-board" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 10px;"></div>
        </div>

        <div class="content-card">
          <h3>신나는 동요 & 게임</h3>
          <div style="height: 150px; background: white; border-radius: 12px; position: relative; overflow: hidden; border: 1px solid #eee;" id="game-area"></div>
          <p style="margin-top: 15px;">풍선을 눌러 터뜨려 보세요!</p>
        </div>
      </div>

      <div style="text-align: center; margin-top: 40px;">
        <a href="blog.html" class="btn-enter" style="background: #27ae60; color: white;">아기 성장 일기 보러가기</a>
      </div>
    </div>
    <script src="main.js"></script>
    <script>
      var krLetters = '가나다라마바사아자차카타파하';
      var viLetters = 'ABCDEGHIKLMNOPQRSTUVXY';
      var currentLang = 'kr';
      var board = document.getElementById('alphabet-board');
      var display = document.getElementById('display-letter');

      function renderBoard() {
        if (!board) return;
        board.innerHTML = '';
        var letters = currentLang === 'kr' ? krLetters : viLetters;
        letters.split('').forEach(function(char) {
          var btn = document.createElement('button');
          btn.style = 'width: 100%; aspect-ratio: 1; background: white; border: 2px solid #27ae60; border-radius: 12px; font-size: 1.2rem; font-weight: 700; cursor: pointer;';
          btn.textContent = char;
          btn.onclick = function() { display.textContent = char; };
          board.appendChild(btn);
        });
      }
      renderBoard();

      var gameArea = document.getElementById('game-area');
      function createBalloon() {
        if (!gameArea) return;
        var balloon = document.createElement('div');
        var size = 30 + Math.random() * 20;
        balloon.style.width = size + 'px';
        balloon.style.height = (size * 1.2) + 'px';
        balloon.style.background = 'hsl(' + (Math.random() * 360) + ', 70%, 60%)';
        balloon.style.borderRadius = '50%';
        balloon.style.position = 'absolute';
        balloon.style.left = Math.random() * (gameArea.clientWidth - size) + 'px';
        balloon.style.bottom = '-60px';
        balloon.style.transition = 'bottom 4s linear';
        balloon.onclick = function() {
          balloon.style.transform = 'scale(2)';
          balloon.style.opacity = '0';
          setTimeout(function() { balloon.remove(); }, 200);
        };
        gameArea.appendChild(balloon);
        setTimeout(function() { balloon.style.bottom = '160px'; }, 10);
        setTimeout(function() { if (balloon.parentNode) balloon.remove(); }, 4000);
      }
      setInterval(createBalloon, 800);
    </script>
  </body>
</html>
